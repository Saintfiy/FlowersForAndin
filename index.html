<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080612">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23090613'/><circle cx='32' cy='32' r='16' fill='%23f2cbe2' opacity='0.9'/></svg>">
  <title>ETHERBLOOM — A Living Digital Sculpture</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #080612;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      color: #f3ecf7
    }

    body {
      font-family: Georgia, 'Times New Roman', serif
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none
    }

    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid rgba(235, 220, 246, .20);
      cursor: pointer;
      touch-action: manipulation;
      outline: none
    }

    button:focus-visible {
      border-color: rgba(248, 224, 255, .75);
      box-shadow: 0 0 0 2px rgba(214, 162, 248, .28)
    }

    #ui {
      position: fixed;
      z-index: 2;
      inset: 0;
      pointer-events: none
    }

    #ui.hidden #mark,
    #ui.hidden #phase,
    #ui.hidden #dock {
      opacity: 0 !important;
      pointer-events: none !important
    }

    #mark {
      position: absolute;
      top: calc(24px + env(safe-area-inset-top, 0px));
      left: calc(28px + env(safe-area-inset-left, 0px));
      font-size: 11px;
      letter-spacing: .24em;
      color: rgba(247, 238, 252, .82);
      text-shadow: 0 2px 16px rgba(6, 3, 14, .88);
      transition: opacity .55s ease
    }

    #mark span {
      opacity: .50
    }

    #phase {
      position: absolute;
      top: calc(25px + env(safe-area-inset-top, 0px));
      right: calc(64px + env(safe-area-inset-right, 0px));
      color: rgba(238, 222, 249, .62);
      font-size: 10px;
      letter-spacing: .20em;
      text-transform: uppercase;
      text-shadow: 0 2px 14px rgba(6, 3, 14, .88);
      transition: opacity .55s ease, color .45s ease
    }

    #hud-toggle {
      position: absolute;
      top: calc(19px + env(safe-area-inset-top, 0px));
      right: calc(24px + env(safe-area-inset-right, 0px));
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      background: rgba(18, 12, 32, .45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-color: rgba(235, 220, 246, .20);
      color: rgba(242, 232, 252, .68);
      opacity: .74;
      transition: opacity .45s ease, border-color .35s ease, background .35s ease, transform .24s ease
    }

    #hud-toggle:hover {
      opacity: 1;
      border-color: rgba(248, 228, 255, .52);
      background: rgba(42, 28, 72, .56)
    }

    #hud-toggle:active {
      transform: scale(.92)
    }

    #ui.hidden #hud-toggle {
      opacity: .28
    }

    #ui.hidden #hud-toggle:hover {
      opacity: .86
    }

    #dock {
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      transition: opacity .55s ease
    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      max-width: 100%;
      pointer-events: auto;
      opacity: 0;
      animation: fadeInControls 1.9s cubic-bezier(.22, 1, .36, 1) 1.6s forwards
    }

    #controls button {
      position: relative;
      padding: 9px 15px;
      min-height: 38px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(28, 19, 46, .54) 0%, rgba(12, 8, 24, .66) 100%);
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      color: rgba(244, 236, 251, .84);
      font-size: 9px;
      letter-spacing: .15em;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(3, 1, 10, .45), inset 0 1px 0 rgba(255, 244, 255, .11);
      transition: background .35s ease, border-color .35s ease, color .35s ease, box-shadow .35s ease, opacity .35s ease, transform .24s cubic-bezier(.22, 1, .36, 1)
    }

    #controls button:hover {
      background: linear-gradient(180deg, rgba(235, 205, 248, .20) 0%, rgba(162, 118, 212, .16) 100%);
      border-color: rgba(248, 228, 255, .56);
      color: rgba(255, 250, 255, .98);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(196, 148, 240, .24), inset 0 1px 0 rgba(255, 255, 255, .20)
    }

    #controls button:active {
      transform: scale(.96)
    }

    #controls button.active {
      background: linear-gradient(180deg, rgba(228, 186, 246, .24) 0%, rgba(154, 108, 204, .20) 100%);
      border-color: rgba(246, 218, 255, .64);
      color: #fff9fe;
      box-shadow: 0 0 22px rgba(218, 166, 250, .28), inset 0 1px 0 rgba(255, 255, 255, .24)
    }

    #controls button.dimmed {
      opacity: .36
    }

    #sound.sound-invite {
      animation: soundInviteGlow 3.2s ease-in-out infinite
    }

    @keyframes soundInviteGlow {

      0%,
      100% {
        border-color: rgba(235, 220, 246, .20);
        box-shadow: 0 4px 18px rgba(3, 1, 10, .45), inset 0 1px 0 rgba(255, 244, 255, .11)
      }

      50% {
        border-color: rgba(244, 212, 255, .52);
        box-shadow: 0 0 18px rgba(214, 166, 250, .24), inset 0 1px 0 rgba(255, 248, 255, .20)
      }
    }

    @media(max-width:600px) {
      #mark {
        left: calc(16px + env(safe-area-inset-left, 0px));
        font-size: 10px;
        letter-spacing: .20em
      }

      #phase {
        right: calc(50px + env(safe-area-inset-right, 0px));
        font-size: 9px
      }

      #hud-toggle {
        top: calc(18px + env(safe-area-inset-top, 0px));
        right: calc(14px + env(safe-area-inset-right, 0px));
        width: 24px;
        height: 24px
      }

      #dock {
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        left: 10px;
        right: 10px;
        gap: 8px
      }

      #controls {
        gap: 6px
      }

      #controls button {
        padding: 8px 11px;
        min-height: 36px;
        font-size: 8.5px;
        letter-spacing: .10em
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important
      }
    }

    @keyframes fadeInControls {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }
  </style>
</head>

<body>
  <canvas id="gl"></canvas>

  <div id="ui">
    <div id="mark">For Andin Only <span>/</span></div>
    <div id="phase" aria-live="polite">THE VOID</div>
    <button id="hud-toggle" type="button" aria-label="Hide interface" title="Hide interface (H)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z" />
        <circle cx="12" cy="12" r="2.8" />
      </svg>
    </button>
    <div id="dock">
      <nav id="controls" aria-label="Artwork controls">
        <button id="decay" type="button">DECAY</button>
        <button id="rebirth" type="button">REBIRTH</button>
        <button id="particles" type="button">FIELD ON</button>
        <button id="infinite" type="button">INFINITE FLOWER</button>
        <button id="sound" type="button">SOUND OFF</button>
      </nav>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    'use strict';

    // ============================================================================
    // RENDERER, SCENE, VIEWPORT & GPU ATMOSPHERIC GALLERY BACKDROP
    // ============================================================================
    const glCanvas = document.getElementById('gl');
    const isTouchDevice = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
    const isMobileViewport = () => Math.min(innerWidth, innerHeight) < 768 || isTouchDevice;
    const getViewportSize = () => ({
      w: Math.max(1, Math.round(window.visualViewport ? window.visualViewport.width : innerWidth)),
      h: Math.max(1, Math.round(window.visualViewport ? window.visualViewport.height : innerHeight))
    });
    let { w: W, h: H } = getViewportSize();
    let dprScale = 1, avgFrameDt = 0.016, slowFrameStreak = 0;
    let DPR = Math.min(devicePixelRatio || 1, isMobileViewport() ? 1.5 : 2);
    const getScreenScale = () => Math.min(1, Math.max(0.48, W / 900));

    const renderer = new THREE.WebGLRenderer({
      canvas: glCanvas,
      antialias: !isMobileViewport() || (devicePixelRatio || 1) < 2,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setClearColor(0x040208, 1);
    renderer.outputEncoding = THREE.sRGBEncoding;

    glCanvas.addEventListener('webglcontextlost', e => { e.preventDefault(); }, false);
    glCanvas.addEventListener('webglcontextrestored', () => { resize(); }, false);

    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
    const baseCamPos = new THREE.Vector3();
    const camTarget = new THREE.Vector3(0, 0.45, 0);
    let particleUniforms = null, dustUniforms = null, pollenUniforms = null, sparkUniforms = null, beadUniforms = null, ambientUniforms = null, stamenPearlUniforms = null, budAntherMat = null;

    const bgUniforms = {
      uTime: { value: 0 },
      uAspect: { value: W / H },
      uPan: { value: new THREE.Vector2(0, 0) },
      uReveal: { value: 0 },
      uDecay: { value: 0 },
      uInfBloom: { value: 0 },
      uInfTravel: { value: 0 },
      uInfShock: { value: 0 },
      uShockOrigin: { value: new THREE.Vector2(0.5, 0.45) },
      uHeartUv: { value: new THREE.Vector2(0.5, 0.45) },
      uHeartBeat: { value: 0 },
      uPointerUv: { value: new THREE.Vector2(0.5, 0.5) },
      uPointerGlow: { value: 0 }
    };

    const bgQuad = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.ShaderMaterial({
        uniforms: bgUniforms,
        depthTest: false,
        depthWrite: false,
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position.xy, 0.9999, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uAspect;
          uniform vec2 uPan;
          uniform float uReveal;
          uniform float uDecay;
          uniform float uInfBloom;
          uniform float uInfTravel;
          uniform float uInfShock;
          uniform vec2 uShockOrigin;
          uniform vec2 uHeartUv;
          uniform float uHeartBeat;
          uniform vec2 uPointerUv;
          uniform float uPointerGlow;
          varying vec2 vUv;

          float hash21(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
          }

          float vnoise(vec2 p) {
            vec2 i = floor(p), f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
              mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
              u.y
            );
          }

          float fbm(vec2 p) {
            float v = 0.0, a = 0.5;
            mat2 rot = mat2(0.80, -0.60, 0.60, 0.80);
            for (int i = 0; i < 4; i++) {
              v += a * vnoise(p);
              p = rot * p * 2.04 + vec2(1.7, 9.2);
              a *= 0.5;
            }
            return v;
          }

          float meteorStreak(vec2 p, float tCycle, float seed) {
            float t = fract(uTime * 0.092 + seed);
            float isAlive = smoothstep(0.0, 0.03, t) * (1.0 - smoothstep(0.11, 0.17, t));
            if (isAlive <= 0.001) return 0.0;
            float prog = clamp(t / 0.16, 0.0, 1.0);
            vec2 start = vec2(-0.55 * uAspect + seed * 0.6, 0.42 - seed * 0.18);
            vec2 dir = normalize(vec2(0.92, -0.38));
            vec2 head = start + dir * (prog * 1.15);
            vec2 rel = p - head;
            float along = dot(rel, dir);
            float perp = length(rel - dir * along);
            float tail = smoothstep(-0.34, 0.0, along) * (1.0 - smoothstep(0.0, 0.025, along));
            return exp(-perp * 240.0) * tail * isAlive;
          }

          void main() {
            vec2 p = (vUv - 0.5) * vec2(uAspect, 1.0);
            vec2 heart = (uHeartUv - 0.5) * vec2(uAspect, 1.0);

            // 1. Deep nocturnal twilight gallery gradient (balanced sRGB velvet depth)
            float skyRadial = length((vUv - vec2(0.5 + uPan.x * 0.035, 0.44 + uPan.y * 0.035)) * vec2(uAspect * 0.70, 1.0));
            vec3 skyCenter = mix(vec3(0.095, 0.064, 0.168), vec3(0.072, 0.048, 0.125), uDecay * 0.55);
            skyCenter = mix(skyCenter, vec3(0.128, 0.072, 0.215), uInfBloom * 0.65);
            vec3 skyEdge = vec3(0.015, 0.009, 0.032);
            vec3 col = mix(skyCenter, skyEdge, smoothstep(0.0, 0.92, skyRadial));

            // 2. Domain-warped silky aurora veils drifting softly behind the sculpture
            vec2 q = p * 1.55 + uPan * 0.14;
            float n1 = fbm(q + vec2(uTime * 0.018, -uTime * 0.012));
            float n2 = fbm(q * 1.35 + vec2(n1 * 1.25, uTime * 0.021));
            float ribbon1 = exp(-pow((p.y - 0.05 + (n1 - 0.5) * 0.44) * 2.6, 2.0)) * smoothstep(0.20, 0.78, n2);
            float ribbon2 = exp(-pow((p.x * 0.42 + p.y - 0.02 + (n2 - 0.5) * 0.36) * 2.2, 2.0)) * smoothstep(0.22, 0.80, n1);

            float auraMask = (0.45 + 0.55 * uReveal) * mix(1.0, 0.72, uDecay * 0.45);
            vec3 aurRose = mix(vec3(0.46, 0.22, 0.44), vec3(0.66, 0.28, 0.60), uInfBloom);
            vec3 aurAqua = mix(vec3(0.16, 0.36, 0.56), vec3(0.24, 0.50, 0.78), uInfBloom);
            vec3 aurGold = vec3(0.64, 0.44, 0.34);
            col += aurRose * ribbon1 * (0.24 + 0.10 * uInfBloom) * auraMask;
            col += aurAqua * ribbon2 * (0.19 + 0.12 * uInfBloom) * auraMask;
            col += aurGold * (ribbon1 * ribbon2) * (0.10 + 0.16 * uInfBloom) * auraMask;

            // Diagonal gallery moonlight spotlight mist softly illuminating flower silhouette
            float beamProj = p.x * 0.62 + p.y * 0.78;
            float airBeam = exp(-beamProj * beamProj * 4.8) * (0.055 + 0.045 * uReveal) * (1.0 - 0.42 * uDecay);
            col += vec3(0.42, 0.31, 0.58) * airBeam;

            // 3. Soft sculpture floor pedestal halo beneath stem base
            vec2 pedDelta = (vUv - vec2(0.5 + uPan.x * 0.022, 0.145 + uPan.y * 0.015)) * vec2(uAspect * 0.54, 2.35);
            float pedHalo = exp(-dot(pedDelta, pedDelta) * 4.2);
            float pedCore = exp(-dot(pedDelta, pedDelta) * 16.0);
            col += (vec3(0.36, 0.26, 0.56) * pedHalo + vec3(0.58, 0.44, 0.78) * pedCore * 0.55) * (0.14 + 0.20 * uReveal) * (1.0 - 0.78 * uInfTravel);

            // 4. Infinite Flower sanctuary corona, rotating cathedral rays & shockwave ripple
            vec2 dH = p - heart;
            float rH = length(dH);
            if (uInfBloom > 0.005) {
              float infPow = smoothstep(0.0, 0.88, uInfBloom);
              float coreHalo = exp(-rH * 2.5) * (0.24 + 0.08 * uHeartBeat);
              float midNeb = exp(-rH * 1.32) * (0.15 + 0.11 * n2);
              float ang = atan(dH.y, dH.x) + uTime * 0.042;
              float rays = pow(max(0.0, cos(ang * 6.0) * 0.5 + 0.5), 4.0) * 0.65
                         + pow(max(0.0, cos(ang * 3.0 - uTime * 0.07) * 0.5 + 0.5), 6.0) * 0.35;
              float rayAtten = exp(-rH * 1.45) * (1.0 - exp(-rH * 7.5));
              col += mix(vec3(0.58, 0.26, 0.62), vec3(0.95, 0.66, 0.78), exp(-rH * 2.4)) * coreHalo * infPow;
              col += vec3(0.24, 0.50, 0.80) * midNeb * infPow;
              col += mix(vec3(0.92, 0.68, 0.54), vec3(0.68, 0.44, 0.92), n1) * rays * rayAtten * 0.18 * infPow;
            }

            // Tap / dive luminous atmospheric shockwave ring
            if (uInfShock > 0.002) {
              vec2 shP = p - (uShockOrigin - 0.5) * vec2(uAspect, 1.0);
              float shR = length(shP);
              float ringPos = (1.0 - uInfShock) * 0.85;
              float ring = exp(-pow((shR - ringPos) * 22.0, 2.0)) * uInfShock;
              col += mix(vec3(0.98, 0.74, 0.90), vec3(0.56, 0.88, 1.0), n1) * ring * 0.36;
            }

            // 5. Distant shooting star wisps & subtle pointer twilight lantern glow
            float m1 = meteorStreak(p, uTime, 0.18);
            float m2 = meteorStreak(p * vec2(-1.0, 1.0), uTime, 0.63);
            col += vec3(0.94, 0.86, 1.0) * (m1 + m2) * 0.55 * uReveal;

            vec2 ptrD = p - (uPointerUv - 0.5) * vec2(uAspect, 1.0);
            col += vec3(0.30, 0.20, 0.45) * exp(-dot(ptrD, ptrD) * 6.5) * uPointerGlow * 0.16;

            // 6. Gallery edge vignette & triangular dither (prevents OLED banding)
            float vig = 1.0 - smoothstep(0.42, 1.12, length(vUv - 0.5) * 1.42);
            col *= mix(0.68, 1.0, vig);
            float dither = (hash21(gl_FragCoord.xy + fract(uTime) * 19.0) + hash21(gl_FragCoord.xy * 1.37 - fract(uTime) * 7.0) - 1.0) / 255.0;
            gl_FragColor = vec4(max(col + dither, 0.0), 1.0);
          }
        `
      })
    );
    bgQuad.renderOrder = -1000;
    bgQuad.frustumCulled = false;
    scene.add(bgQuad);

    function resize() {
      const vp = getViewportSize();
      W = vp.w;
      H = vp.h;
      const baseCap = isMobileViewport() ? 1.5 : 2;
      DPR = Math.max(1, Math.min(devicePixelRatio || 1, baseCap) * dprScale);
      renderer.setPixelRatio(DPR);
      renderer.setSize(W, H, false);
      const pRatio = Math.min(DPR, 1.75);
      const sScale = getScreenScale();
      if (particleUniforms) particleUniforms.uPixelRatio.value = pRatio;
      if (dustUniforms) dustUniforms.uPixelRatio.value = pRatio;
      if (pollenUniforms) pollenUniforms.uPixelRatio.value = pRatio;
      if (sparkUniforms) {
        sparkUniforms.uPixelRatio.value = pRatio;
        sparkUniforms.uScreenScale.value = sScale;
      }
      if (beadUniforms) beadUniforms.uPixelRatio.value = pRatio;
      if (stamenPearlUniforms) {
        stamenPearlUniforms.uPixelRatio.value = pRatio;
        stamenPearlUniforms.uScreenScale.value = sScale;
      }
      if (budAntherMat) budAntherMat.uniforms.uPixelRatio.value = pRatio;
      if (ambientUniforms) {
        ambientUniforms.uPixelRatio.value = pRatio;
        ambientUniforms.uScreenScale.value = sScale;
        ambientUniforms.uAspect.value = W / H;
      }
      bgUniforms.uAspect.value = W / H;
      cam.aspect = W / H;
      const portrait = H > W;
      // Frame entire sculpture comfortably above bottom dock and below header
      baseCamPos.set(0, portrait ? 2.55 : 2.35, Math.max(portrait ? 13.8 : 11.4, 6.4 / cam.aspect));
      cam.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    addEventListener('orientationchange', () => setTimeout(resize, 120));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    resize();

    // ============================================================================
    // MATH, EASING & DELTA-TIME UTILITIES
    // ============================================================================
    const TAU = Math.PI * 2;
    const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const lerp = (a, b, t) => a + (b - a) * t;
    const damp = (current, target, lambda, dt) => THREE.MathUtils.damp(current, target, lambda, dt);
    function smoothDamp(current, target, velObj, smoothTime, dt) {
      if (dt <= 0) return current;
      smoothTime = Math.max(0.0001, smoothTime);
      const omega = 2 / smoothTime;
      const x = omega * dt;
      const exp = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
      const change = current - target;
      const temp = (velObj.v + omega * change) * dt;
      velObj.v = (velObj.v - omega * temp) * exp;
      let out = target + (change + temp) * exp;
      if ((target - current > 0) === (out > target)) {
        out = target;
        velObj.v = 0;
      }
      return out;
    }
    const smoothstep = (a, b, x) => {
      const t = clamp((x - a) / (b - a));
      return t * t * (3 - 2 * t);
    };
    const smootherstep = (a, b, x) => {
      const t = clamp((x - a) / (b - a));
      return t * t * t * (t * (t * 6 - 15) + 10);
    };
    const easeInOutCubic = x => {
      x = clamp(x);
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) * 0.5;
    };

    let sd = 11;
    const rnd = () => {
      sd = (sd * 16807) % 2147483647;
      return sd / 2147483647;
    };

    // ============================================================================
    // PROCEDURAL TEXTURES & MATCAPS (ORIGINAL LAVENDER / PEARL / CYAN IDENTITY)
    // ============================================================================
    function tex(draw, n = 128) {
      const k = document.createElement('canvas');
      k.width = k.height = n;
      draw(k.getContext('2d'), n);
      return new THREE.CanvasTexture(k);
    }

    const auraTex = tex(x => {
      const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0, 'rgba(255,244,252,0.9)');
      g.addColorStop(0.28, 'rgba(244,195,230,0.45)');
      g.addColorStop(0.6, 'rgba(176,162,240,0.14)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g;
      x.fillRect(0, 0, 128, 128);
    }, 128);
    auraTex.encoding = THREE.sRGBEncoding;

    const starFlareTex = tex(x => {
      const c = 64;
      const g = x.createRadialGradient(c, c, 0, c, c, c);
      g.addColorStop(0, 'rgba(255,250,240,0.95)');
      g.addColorStop(0.18, 'rgba(255,214,238,0.48)');
      g.addColorStop(0.5, 'rgba(198,166,255,0.12)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g;
      x.fillRect(0, 0, 128, 128);
      for (let r = 0; r < 2; r++) {
        x.save();
        x.translate(c, c);
        x.rotate(r * Math.PI * 0.5);
        const ray = x.createLinearGradient(-c, 0, c, 0);
        ray.addColorStop(0, 'rgba(255,255,255,0)');
        ray.addColorStop(0.35, 'rgba(255,232,248,0.22)');
        ray.addColorStop(0.5, 'rgba(255,255,255,0.92)');
        ray.addColorStop(0.65, 'rgba(255,232,248,0.22)');
        ray.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = ray;
        x.beginPath();
        x.ellipse(0, 0, c * 0.96, 2.8, 0, 0, TAU);
        x.fill();
        x.restore();
      }
    }, 128);
    starFlareTex.encoding = THREE.sRGBEncoding;

    function grid(nu, nv, pos, col, uv) {
      const idx = [];
      for (let j = 0; j < nv; j++) {
        for (let i = 0; i < nu; i++) {
          const a = j * (nu + 1) + i, b = a + nu + 1;
          idx.push(a, b, a + 1, b, b + 1, a + 1);
        }
      }
      if (!uv) {
        uv = new Float32Array((nu + 1) * (nv + 1) * 2);
        let p = 0;
        for (let j = 0; j <= nv; j++) {
          const v = j / nv;
          for (let i = 0; i <= nu; i++) {
            uv[p++] = i / nu;
            uv[p++] = v;
          }
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      g.setIndex(idx);
      g.computeVertexNormals();
      return g;
    }

    // Per-pixel 512x512 velvet-satin BRDF MatCap synthesis (zero flat gradient rings)
    function matcap(pal, specPow = 24, velvetPow = 2.0, sheenStr = 0.22) {
      const size = 512;
      const k = document.createElement('canvas');
      k.width = k.height = size;
      const ctx = k.getContext('2d');
      const img = ctx.createImageData(size, size);
      const px = img.data;
      const invHalf = 1 / (size * 0.5);

      // Normalized light & view directions in camera space
      const lx = -0.44, ly = 0.54, lz = 0.717;
      const hx = lx, hy = ly, hz = lz + 1.0;
      const hLen = Math.hypot(hx, hy, hz);
      const hnx = hx / hLen, hny = hy / hLen, hnz = hz / hLen;

      const rx = 0.72, ry = -0.36, rz = 0.59;
      const bx = -0.64, by = -0.52, bz = 0.56;

      for (let y = 0; y < size; y++) {
        const ny = -(y * invHalf - 1.0);
        for (let x = 0; x < size; x++) {
          const nx = x * invHalf - 1.0;
          const r2 = nx * nx + ny * ny;
          const off = (y * size + x) * 4;
          if (r2 >= 1.0) {
            // Extend boundary edge cleanly by clamped unit normal to prevent bilinear seam
            const invR = 1 / Math.sqrt(r2);
            const ex = nx * invR, ey = ny * invR;
            const dWrap = clamp((ex * lx + ey * ly) * 0.5 + 0.45);
            const rB = Math.max(0, ex * rx + ey * ry);
            const bB = Math.max(0, ex * bx + ey * by);
            const vel = sheenStr * 1.15;
            px[off] = Math.min(255, pal.c0[0] * (1 - dWrap) + pal.c1[0] * dWrap + pal.rimA[0] * rB + pal.rimB[0] * bB + pal.sheen[0] * vel);
            px[off + 1] = Math.min(255, pal.c0[1] * (1 - dWrap) + pal.c1[1] * dWrap + pal.rimA[1] * rB + pal.rimB[1] * bB + pal.sheen[1] * vel);
            px[off + 2] = Math.min(255, pal.c0[2] * (1 - dWrap) + pal.c1[2] * dWrap + pal.rimA[2] * rB + pal.rimB[2] * bB + pal.sheen[2] * vel);
            px[off + 3] = 255;
            continue;
          }
          const nz = Math.sqrt(1.0 - r2);
          const ndl = nx * lx + ny * ly + nz * lz;
          const wrap = clamp(ndl * 0.54 + 0.48);
          const wrapSmooth = wrap * wrap * (3.0 - 2.0 * wrap);
          const midBand = Math.pow(wrapSmooth, 1.85);
          const hiBand = Math.pow(clamp(ndl), 2.2);

          // Triple-stop botanical shadow -> midtone -> luminous peak
          let r = lerp(pal.c0[0], pal.c1[0], wrapSmooth);
          let g = lerp(pal.c0[1], pal.c1[1], wrapSmooth);
          let b = lerp(pal.c0[2], pal.c1[2], wrapSmooth);

          r = lerp(r, pal.c2[0], midBand * 0.72 + hiBand * 0.28);
          g = lerp(g, pal.c2[1], midBand * 0.72 + hiBand * 0.28);
          b = lerp(b, pal.c2[2], midBand * 0.72 + hiBand * 0.28);

          // Satin specular & floral epidermal velvet micro-sheen with soft filmic rolloff
          const spec = Math.pow(Math.max(0, nx * hnx + ny * hny + nz * hnz), specPow) * 0.24;
          const velvet = Math.pow(1.0 - nz, velvetPow) * sheenStr;
          const bounceA = Math.pow(Math.max(0, nx * rx + ny * ry + nz * rz), 1.85) * 0.26;
          const bounceB = Math.pow(Math.max(0, nx * bx + ny * by + nz * bz), 1.85) * 0.22;

          r += pal.spec[0] * spec + pal.sheen[0] * velvet + pal.rimA[0] * bounceA + pal.rimB[0] * bounceB;
          g += pal.spec[1] * spec + pal.sheen[1] * velvet + pal.rimA[1] * bounceA + pal.rimB[1] * bounceB;
          b += pal.spec[2] * spec + pal.sheen[2] * velvet + pal.rimA[2] * bounceA + pal.rimB[2] * bounceB;

          const tone = v => 255.0 * (v / (v + 150.0)) * 1.56;
          const d = (((x * 73856093 ^ y * 19349663) & 255) / 255 - 0.5) * 1.4;
          px[off] = clamp(tone(r) + d, 0, 255);
          px[off + 1] = clamp(tone(g) + d, 0, 255);
          px[off + 2] = clamp(tone(b) + d, 0, 255);
          px[off + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const t = new THREE.CanvasTexture(k);
      t.encoding = THREE.sRGBEncoding;
      return t;
    }

    const mcPearl = matcap({
      c0: [34, 12, 52],       // deep velvet plum-rose crevice shadow
      c1: [134, 72, 126],     // rich antique orchid-rose body
      c2: [226, 186, 212],    // luminous silk pearl blush crown
      spec: [255, 236, 246],
      sheen: [232, 186, 228],
      rimA: [108, 186, 226],  // moonlit cyan fill
      rimB: [230, 134, 190]   // rose-quartz back scatter
    }, 26, 2.0, 0.14);

    const mcLeaf = matcap({
      c0: [16, 36, 44],       // deep botanical spruce shadow
      c1: [62, 118, 114],     // velvet sage botanical body
      c2: [180, 220, 214],    // soft dew-kissed sheen
      spec: [224, 250, 244],
      sheen: [164, 210, 212],
      rimA: [112, 204, 198],
      rimB: [192, 152, 208]
    }, 28, 2.05, 0.14);

    const mcStem = matcap({
      c0: [24, 16, 34],       // dark bronze-plum bark
      c1: [94, 76, 110],      // smooth silk bark midtone
      c2: [198, 184, 212],    // moonlight bark rim
      spec: [232, 222, 244],
      sheen: [182, 156, 206],
      rimA: [112, 178, 198],
      rimB: [196, 140, 184]
    }, 18, 2.2, 0.12);

    // ============================================================================
    // MATCAP + BOTANICAL VENATION, SUBSURFACE GLOW & EMBER DISSOLVE SHADER
    // ============================================================================
    const U = {
      t: { value: 0 },
      breezeX: { value: 0 },
      breezeZ: { value: 0 },
      swayAmp: { value: 1 },
      heartGlow: { value: 0 },
      heartWorld: { value: new THREE.Vector3(0, 2.0, 0) },
      view: { value: cam.matrixWorldInverse }
    };

    // bioMode: 0=stem/core, 1=rose petal (veins + nectar scatter + ember dissolve), 2=leaf/sepal, 3=butterfly wing
    function mat(map, vc, color, withSway = true, transparent = false, rimStrength = 0.14, innerGlow = 0.24, bioMode = 0) {
      const m = new THREE.MeshMatcapMaterial({
        matcap: map,
        vertexColors: !!vc,
        side: THREE.DoubleSide,
        color: color || 0xffffff,
        transparent,
        opacity: 1
      });
      m.userData.uPetalDecay = { value: 0 };
      m.onBeforeCompile = s => {
        s.uniforms.uT = U.t;
        s.uniforms.uBreezeX = U.breezeX;
        s.uniforms.uBreezeZ = U.breezeZ;
        s.uniforms.uSwayAmp = U.swayAmp;
        s.uniforms.uHeartGlow = U.heartGlow;
        s.uniforms.uHeartWorld = U.heartWorld;
        s.uniforms.uView = U.view;
        s.uniforms.uRimStrength = { value: rimStrength };
        s.uniforms.uInnerGlow = { value: innerGlow };
        s.uniforms.uPetalDecay = m.userData.uPetalDecay;

        s.vertexShader =
          'uniform float uT;uniform float uBreezeX;uniform float uBreezeZ;uniform float uSwayAmp;uniform mat4 uView;\n' +
          'varying vec3 vWorldPosCustom;\n' +
          'varying vec2 vBioUv;\n' +
          s.vertexShader
            .replace(
              '#include <begin_vertex>',
              'vBioUv=uv;\n#include <begin_vertex>'
            )
            .replace(
              '#include <project_vertex>',
              (withSway
                ? 'vec4 wp=modelMatrix*vec4(transformed,1.0);' +
                'float hh=max(wp.y+2.6,0.0);' +
                'float hNorm=hh*0.21;' +
                'float bend=hNorm*hNorm;' +
                'wp.x+=(uBreezeX+sin(uT*0.36+wp.y*0.4)*0.04)*bend*uSwayAmp;' +
                'wp.z+=(uBreezeZ+cos(uT*0.29+wp.y*0.35)*0.028)*bend*uSwayAmp;' +
                'vWorldPosCustom=wp.xyz;' +
                'vec4 mvPosition=uView*wp;gl_Position=projectionMatrix*mvPosition;'
                : 'vec4 wp=modelMatrix*vec4(transformed,1.0);vWorldPosCustom=wp.xyz;' +
                'vec4 mvPosition=modelViewMatrix*vec4(transformed,1.0);gl_Position=projectionMatrix*mvPosition;')
            );

        let bioFragCode = '';
        if (bioMode === 1) {
          bioFragCode =
            'float pu=(vBioUv.x-0.5)*2.0;float pv=vBioUv.y;' +
            'float fanA=atan(pu,pv+0.26);' +
            'float pVein=pow(0.5+0.5*sin(fanA*24.0+sin(pv*7.0)*0.6),4.0)*0.052*smoothstep(0.05,0.45,pv)*(1.0-smoothstep(0.85,1.0,pv));' +
            'float throatDepth=smoothstep(0.66,0.0,pv);' +
            'float foldContrast=mix(0.94,1.05,smoothstep(0.32,0.95,pv));' +
            'outgoingLight*=mix(vec3(1.0),vec3(0.70,0.42,0.64),throatDepth*0.60)*foldContrast*(0.98+pVein*0.52);' +
            'float sssEdge=smoothstep(0.50,0.98,pv)*smoothstep(0.08,0.65,1.0-ndv);' +
            'outgoingLight+=vec3(0.96,0.60,0.80)*sssEdge*0.16;' +
            'if(uPetalDecay>0.01){' +
            '  float f1=sin(pu*3.1+pv*2.4)*0.5+0.5;' +
            '  float f2=cos(pu*6.7-pv*5.3+1.4)*0.5+0.5;' +
            '  float f3=sin(pu*12.3+pv*10.7-0.8)*0.5+0.5;' +
            '  float org=f1*0.52+f2*0.32+f3*0.16;' +
            '  float monoBase=(1.0-pv)*0.72+(1.0-abs(pu))*0.28;' +
            '  float val=monoBase+(org-0.5)*0.22;' +
            '  float thresh=uPetalDecay*1.12-0.08;' +
            '  float mask=smoothstep(thresh-0.14,thresh+0.05,val);' +
            '  if(mask<0.02)discard;' +
            '  float ember=exp(-pow((val-thresh)*18.0,2.0))*smoothstep(0.02,0.16,uPetalDecay)*(1.0-smoothstep(0.78,1.0,uPetalDecay));' +
            '  outgoingLight+=vec3(1.0,0.74,0.88)*ember*0.85;' +
            '  diffuseColor.a*=mask;' +
            '}';
        } else if (bioMode === 2) {
          bioFragCode =
            'float lu=(vBioUv.x-0.5)*2.0;float lv=vBioUv.y;' +
            'float midrib=exp(-pow(lu*13.0,2.0))*0.22;' +
            'float latVein=pow(max(0.0,cos((abs(lu)*6.2-lv*8.5)*3.14159)),8.0)*smoothstep(0.08,0.85,lv)*0.08;' +
            'float tipBlush=smoothstep(0.66,1.0,lv);' +
            'outgoingLight=mix(outgoingLight,outgoingLight*vec3(1.16,0.98,1.22),tipBlush*0.32)+vec3(0.45,0.84,0.82)*(midrib+latVein)*0.20;';
        } else if (bioMode === 3) {
          bioFragCode =
            'float wingR=clamp(length(vBioUv)*2.1,0.0,1.0);' +
            'float cell=pow(0.5+0.5*sin(vBioUv.x*32.0+vBioUv.y*18.0),4.0)*0.16;' +
            'float scaleIrid=0.5+0.5*sin(wingR*8.0+uT*2.2);' +
            'vec3 shimmer=mix(vec3(0.70,0.92,1.0),vec3(1.0,0.76,0.94),scaleIrid);' +
            'outgoingLight=outgoingLight*(1.08-cell*0.42)+shimmer*(0.30*pow(1.0-ndv,1.35)+0.22*smoothstep(0.45,1.0,wingR));';
        } else if (bioMode === 4) {
          bioFragCode =
            'float rootFade=smoothstep(-2.60,-2.16,vWorldPosCustom.y);' +
            'outgoingLight+=vec3(0.76,0.62,0.96)*(1.0-rootFade)*0.32;' +
            'diffuseColor.a*=rootFade;';
        }

        s.fragmentShader =
          'uniform float uT;uniform float uHeartGlow;uniform vec3 uHeartWorld;uniform float uRimStrength;uniform float uInnerGlow;uniform float uPetalDecay;\n' +
          'varying vec3 vWorldPosCustom;\n' +
          'varying vec2 vBioUv;\n' +
          s.fragmentShader
            .replace(
              '#include <normal_fragment_begin>',
              'vec3 normal=normalize(vNormal);' +
              'float smoothFace=dot(normal,normalize(vViewPosition))>=0.0?1.0:-1.0;' +
              'normal=normal*smoothFace;' +
              'vec3 geometryNormal=normal;'
            )
            .replace(
              'gl_FragColor = vec4( outgoingLight, diffuseColor.a );',
              'vec3 vDir=normalize(vViewPosition);' +
              'vec3 nDir=normalize(normal);' +
              'float ndv=abs(dot(nDir,vDir));' +
              'float fres=pow(1.0-ndv,2.8)*smoothstep(0.03,0.26,ndv);' +
              'float irid=0.5+0.5*sin(ndv*5.2+uT*0.35+vWorldPosCustom.y*1.15);' +
              'vec3 rimCol=mix(vec3(0.99,0.78,0.91),vec3(0.72,0.91,1.0),irid);' +
              'float distH=length(vWorldPosCustom-uHeartWorld);' +
              'float hGlow=exp(-distH*1.75)*uHeartGlow*uInnerGlow;' +
              'outgoingLight+=rimCol*fres*uRimStrength+vec3(1.0,0.76,0.88)*hGlow;' +
              bioFragCode +
              'gl_FragColor = vec4( outgoingLight, diffuseColor.a );'
            );
      };
      m.customProgramCacheKey = () => `etherbloom-matcap-v4-${withSway ? 1 : 0}-${rimStrength}-${innerGlow}-${bioMode}`;
      return m;
    }

    const woodMat = mat(mcStem, false, 0xd8cce2, true, true, 0.08, 0.04, 4);
    const petalBaseMat = mat(mcPearl, true, 0xffffff, true, true, 0.16, 0.28, 1);
    const leafMat = mat(mcLeaf, true, 0xffffff, true, true, 0.11, 0.07, 2);
    const calyxMat = mat(mcLeaf, true, 0xe8faf5, true, true, 0.11, 0.12, 0);
    const coreMat = mat(mcPearl, false, 0xffdced, true, true, 0.16, 0.58, 0);

    // ============================================================================
    // PROCEDURAL COUTURE ROSE, STEM, STIPULES, DEWDROPS & PETAL GEOMETRY
    // ============================================================================
    const plant = new THREE.Group();
    scene.add(plant);

    function tube(curve, N, radial, rf) {
      const fr = curve.computeFrenetFrames(N, false), pos = [], nor = [], uv = [], idx = [];
      for (let i = 0; i <= N; i++) {
        const uLen = i / N;
        const p = curve.getPointAt(uLen), r = rf(uLen), n = fr.normals[i], b = fr.binormals[i];
        for (let j = 0; j <= radial; j++) {
          const a = (j / radial) * TAU, c = Math.cos(a), s = Math.sin(a);
          const x = n.x * c + b.x * s, y = n.y * c + b.y * s, z = n.z * c + b.z * s;
          pos.push(p.x + x * r, p.y + y * r, p.z + z * r);
          nor.push(x, y, z);
          uv.push(j / radial, uLen);
        }
      }
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < radial; j++) {
          const a = i * (radial + 1) + j, b = a + radial + 1;
          idx.push(a, b, a + 1, b, b + 1, a + 1);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      g.setIndex(idx);
      g.userData = { N, seg: radial * 6 };
      return g;
    }

    function branch(pts, r0, r1, step, th0) {
      const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))), N = 200;
      const mesh = new THREE.Mesh(tube(curve, N, 12, u => lerp(r0, r1, Math.pow(u, 0.58))), woodMat);
      mesh.frustumCulled = false;
      plant.add(mesh);
      const fr = curve.computeFrenetFrames(100, false), thorns = [];
      const upVec = new THREE.Vector3(0, 1, 0);
      for (let i = 5; i < 94; i += step) {
        const u = i / 100, p = curve.getPointAt(u), t = curve.getTangentAt(u), a = i * 1.9;
        const n = fr.normals[i].clone().multiplyScalar(Math.cos(a)).addScaledVector(fr.binormals[i], Math.sin(a));
        const h = th0 * (0.95 + rnd() * 0.65), th = new THREE.Mesh(new THREE.ConeGeometry(0.019, h, 8), woodMat);
        th.position.copy(p).addScaledVector(n, lerp(r0, r1, Math.pow(u, 0.58)) * 0.82);
        th.quaternion.setFromUnitVectors(upVec, n.clone().multiplyScalar(0.85).addScaledVector(t, 0.45).normalize());
        th.translateY(h * 0.35);
        plant.add(th);
        thorns.push({ th, u });
      }
      return { curve, mesh, thorns };
    }

    function updateStemGrowth(b, p) {
      const g = b.mesh.geometry.userData;
      b.mesh.geometry.setDrawRange(0, Math.floor(clamp(p) * g.N) * g.seg);
      for (let i = 0; i < b.thorns.length; i++) {
        const o = b.thorns[i];
        const s = smootherstep(o.u + 0.02, o.u + 0.11, p);
        o.th.visible = s > 0.005;
        o.th.scale.setScalar(Math.max(s, 0.001));
      }
    }

    function Pf(e) {
      e = clamp(e);
      return (0.2 + 0.9 * Math.pow(Math.sin(Math.PI * (0.08 + 0.84 * Math.pow(e, 0.8))), 0.7)) * (0.55 + 0.45 * smoothstep(0, 0.35, e));
    }

    function buildHead(N) {
      const petals = [], g = new THREE.Group();
      // 32x28 couture botanical mesh keeps curved cordate petal rims velvety smooth
      const nu = 32, nv = 28;
      for (let i = 0; i < N; i++) {
        const k = i / (N - 1), col = [], tone = 0.96 + rnd() * 0.04;
        // Richer rose-carmine warm heart transitioning into luminous porcelain-lavender tips
        const heartMix = 0.32 + 0.68 * k;
        for (let j = 0; j <= nv; j++) {
          const v = j / nv;
          for (let q = 0; q <= nu; q++) {
            const u = (q / nu) * 2 - 1, au = Math.abs(u);
            const satin = 0.76 + 0.24 * Math.sin(v * Math.PI * 0.92) * (0.76 + 0.24 * Math.cos(u * Math.PI * 0.65));
            const edge = 1 - 0.12 * Math.pow(au, 4.2) * (1 - v * 0.22);
            const vein = 0.985 + 0.015 * Math.exp(-Math.pow(u / 0.10, 2)) * Math.sin(v * Math.PI);
            const baseWarm = (1 - smoothstep(0.0, 0.76, v)) * heartMix;
            const tipBlush = smoothstep(0.74, 1.0, v) * (1 - k * 0.45);
            const f = satin * edge * vein * tone;
            const rCol = f * lerp(1.00, 1.07, baseWarm) + 0.025 * tipBlush;
            const gCol = f * lerp(0.93, 0.75, baseWarm) + 0.010 * tipBlush;
            const bCol = f * lerp(0.98, 0.86, baseWarm) + 0.022 * Math.sin(v * Math.PI) * (1 - k * 0.4);
            col.push(rCol, gCol, bCol);
          }
        }
        const y0 = (1 - k) * 0.24 + 0.04;
        const top = 1.92 - 0.66 * Math.pow(k, 1.18) + (rnd() - 0.5) * 0.11 * k;
        const angle = i * 2.399963 + (rnd() - 0.5) * 0.20;
        const L = top - y0;
        const al = Math.max(lerp(3.22, 0.64, Math.pow(k, 0.46)), 0.64) * (0.94 + rnd() * 0.09);
        const rimAmt = Math.max(0, k - 0.16) * 1.46 + rnd() * 0.16;

        const rowPf = new Float32Array(nv + 1);
        const rowWp = new Float32Array(nv + 1);
        const rowSinV = new Float32Array(nv + 1);
        const rowRim = new Float32Array(nv + 1);
        const rowEdgeMask = new Float32Array(nv + 1);
        const rowY = new Float32Array(nv + 1);
        const rowArch = new Float32Array(nv + 1);
        const rowCrownEnv = new Float32Array(nv + 1);
        const rowReflex = new Float32Array(nv + 1);
        for (let j = 0; j <= nv; j++) {
          const v = j / nv;
          const hh = y0 + v * L;
          // Rounded garden-rose silhouette without sharp upper-corner shelves
          const tipTaper = 1 - 0.72 * Math.pow(smoothstep(0.48, 1.0, v), 1.42);
          rowY[j] = hh;
          rowPf[j] = Pf(hh / 1.9);
          rowWp[j] = (0.54 + 0.46 * smoothstep(0, 0.42, v)) * tipTaper;
          rowSinV[j] = Math.sin(v * Math.PI);
          rowRim[j] = rimAmt * Math.pow(smoothstep(0.72, 1, v), 1.65) * 0.30;
          rowEdgeMask[j] = Math.pow(smoothstep(0.68, 1.0, v), 1.6);
          rowArch[j] = 0.088 * v * v * (0.35 + 0.65 * k);
          rowCrownEnv[j] = Math.pow(smoothstep(0.40, 1.0, v), 1.35) * (0.58 + 0.42 * (1 - k));
          rowReflex[j] = Math.pow(smoothstep(0.72, 1.0, v), 1.8) * 0.055 * (1 - k * 0.65);
        }

        const ph = rnd() * TAU;
        const tilt = (rnd() - 0.5) * 0.18;
        const colU = new Float32Array(nu + 1);
        const colAu3 = new Float32Array(nu + 1);
        const colCupExp = new Float32Array(nu + 1);
        const colSinU35 = new Float32Array(nu + 1);
        const colCosU25 = new Float32Array(nu + 1);
        const colSinU3 = new Float32Array(nu + 1);
        const colCrownDrop = new Float32Array(nu + 1);
        for (let q = 0; q <= nu; q++) {
          const u = (q / nu) * 2 - 1, au = Math.abs(u);
          colU[q] = u;
          colAu3[q] = au * au * au * 0.13;
          colCupExp[q] = -0.15 * Math.exp(-au * au * 0.9);
          colSinU35[q] = 0.013 * Math.sin(u * 3.5 + ph);
          colCosU25[q] = 0.011 * Math.cos(u * 2.5 + ph * 0.7);
          colSinU3[q] = 0.01 * Math.sin(u * 2.6 + ph);
          // Graceful curved upper petal contour with subtle heirloom rose cleft
          colCrownDrop[q] = -(u * u) * 0.145 * (0.65 + 0.35 * au) - 0.022 * Math.exp(-u * u * 26.0);
        }

        // Outer petals unfurl first, gracefully exposing inner spiral
        const delay = (1 - k) * 0.34;
        const outAngle = angle + (rnd() - 0.5) * 0.55;
        const p = {
          k, nu, nv,
          a: angle,
          ca: Math.cos(angle),
          sa: Math.sin(angle),
          y0, L, al, ph, tilt,
          delay,
          decayDelay: (1 - k) * 0.36,
          detachDir: new THREE.Vector3(Math.cos(outAngle), (rnd() - 0.42) * 0.48 - 0.08 * (1 - k), Math.sin(outAngle)).normalize(),
          detachDist: 1.45 + (1 - k) * 0.85 + rnd() * 0.65,
          swirlSign: (i % 2 === 0 ? 1 : -1) * (0.48 + rnd() * 0.44),
          rotTarget: new THREE.Euler((rnd() - 0.5) * 1.15, (rnd() - 0.5) * 1.4, (rnd() - 0.5) * 1.15),
          rowPf, rowWp, rowSinV, rowRim, rowEdgeMask, rowY, rowArch, rowCrownEnv, rowReflex,
          colU, colAu3, colCupExp, colSinU35, colCosU25, colSinU3, colCrownDrop,
          geo: grid(nu, nv, new Array((nu + 1) * (nv + 1) * 3).fill(0), col),
          mesh: null
        };
        p.geo.attributes.position.setUsage(THREE.DynamicDrawUsage);
        const pm = petalBaseMat.clone();
        pm.userData.uPetalDecay = { value: 0 };
        pm.onBeforeCompile = petalBaseMat.onBeforeCompile;
        pm.customProgramCacheKey = petalBaseMat.customProgramCacheKey;
        pm.depthWrite = true;
        p.mesh = new THREE.Mesh(p.geo, pm);
        p.mesh.renderOrder = N - i;
        p.mesh.frustumCulled = false;
        g.add(p.mesh);
        petals.push(p);
      }
      return { g, petals };
    }

    function updatePetalGeometry(p, b, breathFactor, decayCurl) {
      const sc = (0.25 + 0.75 * p.k) * lerp(0.42, 1.0, b) * breathFactor;
      const wrapMul = lerp(1.16, 1.0, b) * lerp(1.0, 0.86, decayCurl);
      const pos = p.geo.attributes.position.array;
      const ca = p.ca, sa = p.sa;
      const {
        nu, nv, al, tilt,
        rowPf, rowWp, rowSinV, rowRim, rowEdgeMask, rowY, rowArch, rowCrownEnv, rowReflex,
        colU, colAu3, colCupExp, colSinU35, colCosU25, colSinU3, colCrownDrop
      } = p;

      for (let j = 0; j <= nv; j++) {
        const v = j / nv;
        const v2 = v * v;
        const hh = rowY[j];
        const wp = rowWp[j];
        const sinV = rowSinV[j];
        const archOut = rowArch[j] * b - decayCurl * 0.045 * v2 + rowReflex[j] * b;
        const rho0 = Math.max(rowPf[j] * sc + rowRim[j] * b + archOut, 0.055);
        const yOut = hh - archOut * 0.42;
        const edgeM = rowEdgeMask[j];
        const crownEnv = rowCrownEnv[j];
        const tiltV = tilt * v;

        for (let q = 0; q <= nu; q++) {
          const th = colU[q] * al * wrapMul * wp + tiltV;
          const centerCup = colCupExp[q] * sinV * b;
          const wav = colSinU35[q] * sinV * b;
          const edgeWave = edgeM > 0 ? colCosU25[q] * edgeM : 0;
          const rho = rho0 + colAu3[q] * b * v2 + wav + edgeWave;
          const X = rho * Math.sin(th);
          const Z = rho * Math.cos(th);
          const idx = (j * (nu + 1) + q) * 3;
          pos[idx] = X * ca + Z * sa;
          pos[idx + 1] = yOut + centerCup + colSinU3[q] * v + colCrownDrop[q] * crownEnv;
          pos[idx + 2] = -X * sa + Z * ca;
        }
      }
      p.geo.attributes.position.needsUpdate = true;
      p.geo.computeVertexNormals();
    }

    function leafGeo(L, Wd, bend, twist) {
      // High-res 16x36 botanical leaf with fine serrations and sculpted midrib
      const nu = 16, nv = 36, pos = [], col = [], ph = rnd() * 6;
      for (let j = 0; j <= nv; j++) {
        const v = j / nv;
        const taper = Math.sin(Math.PI * Math.pow(v, 0.68));
        const serr = 1 + 0.042 * Math.sin(v * 26 + ph) * Math.sin(v * Math.PI);
        const w = Wd * taper * serr;
        const yc = bend * L * v * v, zc = -0.22 * L * v * v, tw = twist * v;
        for (let i = 0; i <= nu; i++) {
          const u = (i / nu) * 2 - 1, au = Math.abs(u), y = u * w, z = au * w * 0.56 - Math.exp(-u * u * 30) * w * 0.07;
          pos.push(v * L, yc + y * Math.cos(tw) - z * Math.sin(tw), zc + y * Math.sin(tw) + z * Math.cos(tw));
          const vein = 1 - 0.14 * Math.exp(-Math.pow(u / 0.04, 2));
          const rim = 0.84 + 0.16 * smoothstep(0.55, 1, v);
          const f = (0.70 + 0.30 * Math.sin(v * Math.PI * 0.9)) * rim * vein;
          col.push(f * 0.92, f * (0.99 + 0.03 * (1 - au)), f * (0.98 + 0.06 * (1 - au)));
        }
      }
      return grid(nu, nv, pos, col);
    }

    function createButterfly(color) {
      const ws = new THREE.Shape();
      ws.moveTo(0, 0);
      ws.bezierCurveTo(0.11, 0.30, 0.54, 0.46, 0.58, 0.21);
      ws.bezierCurveTo(0.61, 0.03, 0.32, -0.03, 0.13, -0.03);
      ws.bezierCurveTo(0.32, -0.07, 0.44, -0.36, 0.23, -0.38);
      ws.bezierCurveTo(0.09, -0.35, 0.04, -0.16, 0, 0);
      const geo = new THREE.ShapeGeometry(ws, 20), pp = geo.attributes.position, cc = [], uvs = [];
      for (let i = 0; i < pp.count; i++) {
        const px = pp.getX(i), py = pp.getY(i);
        const f = 0.55 + 0.45 * Math.min(1, px / 0.38);
        cc.push(f, f * 0.97, f * 1.03);
        uvs.push(px, py);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(cc, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      // Pearlescent gossamer morpho butterfly without world-space stem sway
      const m = mat(mcPearl, true, color, false, true, 0.26, 0, 3);
      const g = new THREE.Group(), wl = new THREE.Group(), wr = new THREE.Group();
      const a = new THREE.Mesh(geo, m), b = new THREE.Mesh(geo, m);
      b.scale.x = -1;
      wl.add(a);
      wr.add(b);
      const bodyMat = mat(mcStem, false, 0x625078, false, true, 0.05, 0, 0);
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.011, 0.42, 8), bodyMat);
      body.position.y = -0.1;
      const antennaMat = new THREE.LineBasicMaterial({ color: 0xe6d4f8, transparent: true, opacity: 0.72 });
      for (const side of [-1, 1]) {
        const pts = [new THREE.Vector3(side * 0.012, 0.08, 0.01), new THREE.Vector3(side * 0.075, 0.22, 0.02), new THREE.Vector3(side * 0.11, 0.31, 0.01)];
        g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), antennaMat));
      }
      g.add(body, wl, wr);
      g.scale.setScalar(0.001);
      scene.add(g);
      return { g, wl, wr, mats: [m, bodyMat, antennaMat], flapPhase: rnd() * TAU };
    }

    const stem = branch([[0, -2.6, 0], [0.08, -1.5, 0.1], [-0.05, -0.3, -0.06], [0.02, 0.9, 0.05], [0.04, 2, 0]], 0.018, 0.072, 6, 0.1);

    // Luminous genesis sprout glow at the bottom base of stem
    const seedAura = new THREE.Sprite(new THREE.SpriteMaterial({
      map: auraTex,
      color: 0xf4c6e8,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false,
      opacity: 0
    }));
    seedAura.position.set(0, -2.58, 0);
    seedAura.scale.setScalar(0.85);
    plant.add(seedAura);

    // 3D Luminous Floor Sanctuary Plinth & Moonlight Ripples anchoring stem base
    const stemPlinthUniforms = { uTime: { value: 0 }, uOpacity: { value: 0 } };
    const stemPlinthMat = new THREE.ShaderMaterial({
      uniforms: stemPlinthUniforms,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime; uniform float uOpacity; varying vec2 vUv;
        void main() {
          if (uOpacity <= 0.004) discard;
          vec2 p = (vUv - 0.5) * 2.0;
          float r = length(p);
          if (r > 1.0) discard;
          float coreMist = exp(-r * r * 4.8) * 0.24;
          float softPool = exp(-r * r * 1.9) * 0.22;
          float ripple1 = exp(-pow((r - fract(uTime * 0.12) * 0.88) * 14.0, 2.0)) * (1.0 - r) * 0.16;
          float ripple2 = exp(-pow((r - fract(uTime * 0.12 + 0.5) * 0.88) * 14.0, 2.0)) * (1.0 - r) * 0.12;
          vec3 col = mix(vec3(0.46, 0.34, 0.80), vec3(0.86, 0.66, 0.88), coreMist * 1.4);
          col += vec3(0.56, 0.84, 0.98) * (ripple1 + ripple2) * 0.7;
          float a = (coreMist + softPool + ripple1 + ripple2) * uOpacity * (1.0 - smoothstep(0.62, 1.0, r));
          gl_FragColor = vec4(col, a);
        }
      `
    });
    const stemPlinth = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 3.0), stemPlinthMat);
    stemPlinth.rotation.x = -Math.PI * 0.5;
    stemPlinth.position.set(0, -2.59, 0);
    stemPlinth.renderOrder = -10;
    scene.add(stemPlinth);

    // Pin every leaf strictly onto the 3D stem curve (x, y, z) with sculpted botanical petiole collar
    const leaves = [
      [1.6, 2.75, 0.7, 0.72, 0.19, 0.25, 0.6],
      [1.25, 3.3, 0.3, 0.96, 0.24, -0.2, -0.5],
      [0.85, 3.6, 0.5, 0.68, 0.19, 0.3, 0.7],
      [0.55, 0.7, -0.5, 0.88, 0.21, -0.25, 0.5],
      [0.2, 0.1, -0.7, 0.92, 0.19, 0.2, -0.6],
      [1.95, 0.15, -0.9, 0.58, 0.14, 0.2, 0.4]
    ].map((d, i) => {
      const lm = leafMat.clone();
      lm.onBeforeCompile = leafMat.onBeforeCompile;
      lm.customProgramCacheKey = leafMat.customProgramCacheKey;
      const uLeaf = clamp((d[0] + 2.6) / 4.6);
      const stemPt = stem.curve.getPointAt(uLeaf);
      const m = new THREE.Mesh(leafGeo(d[3], d[4], d[5], d[6]), lm);
      m.position.copy(stemPt);
      m.rotation.z = d[1];
      m.rotation.y = d[2];
      m.scale.setScalar(0.001);
      // Small stipule collar smoothly joining petiole base to main stem
      const stipule = new THREE.Mesh(new THREE.ConeGeometry(0.022, 0.075, 7), woodMat);
      stipule.rotation.z = -Math.PI * 0.5;
      stipule.position.x = 0.032;
      m.add(stipule);
      plant.add(m);
      const side = Math.cos(d[1]) >= 0 ? 1 : -1;
      const heightOrder = clamp((d[0] - 0.2) / 1.75);
      return {
        m, lm, uLeaf,
        x0: stemPt.x, y0: stemPt.y, z0: stemPt.z,
        z: d[1], y: d[2],
        phase: 0.55 + i * 0.45,
        fallDelay: 0.06 + heightOrder * 0.22 + rnd() * 0.08,
        fallDrop: stemPt.y + 2.55 + rnd() * 0.45,
        driftX: side * (0.42 + rnd() * 0.44),
        driftZ: (rnd() - 0.5) * 0.65,
        flutterAmp: 0.26 + rnd() * 0.18,
        flutterFreq: 2.0 + rnd() * 1.1,
        spinY: side * (1.2 + rnd() * 1.1),
        droopDir: -side,
        tiltEndX: (rnd() - 0.5) * 0.65
      };
    });

    const head = buildHead(42);
    plant.add(head.g);

    // Sculpted receptacle cup bridging the stem top seamlessly into the sepals and petals
    const receptaclePts = [
      new THREE.Vector2(0.062, -0.05),
      new THREE.Vector2(0.072, 0.0),
      new THREE.Vector2(0.115, 0.07),
      new THREE.Vector2(0.175, 0.15),
      new THREE.Vector2(0.155, 0.23),
      new THREE.Vector2(0.08, 0.27)
    ];
    const receptacleGeo = new THREE.LatheGeometry(receptaclePts, 20);
    const rcPos = receptacleGeo.attributes.position;
    const rcCol = new Float32Array(rcPos.count * 3);
    for (let i = 0; i < rcPos.count; i++) {
      const vy = clamp((rcPos.getY(i) + 0.05) / 0.32);
      const shade = lerp(0.76, 1.0, vy);
      rcCol[i * 3] = shade;
      rcCol[i * 3 + 1] = shade * 1.02;
      rcCol[i * 3 + 2] = shade * 0.99;
    }
    receptacleGeo.setAttribute('color', new THREE.BufferAttribute(rcCol, 3));
    const receptacle = new THREE.Mesh(receptacleGeo, calyxMat);
    head.g.add(receptacle);

    const core = new THREE.Mesh(new THREE.SphereGeometry(0.125, 16, 12), coreMat);
    core.position.y = 1.48;
    core.scale.y = 1.38;
    head.g.add(core);
    const heartCenter = new THREE.Object3D();
    heartCenter.position.set(0, 1.38, 0);
    head.g.add(heartCenter);

    // Delicate golden stamen pearls peeking softly inside the living rose crown
    const budAntherCount = 14;
    const budAntherPos = new Float32Array(budAntherCount * 3);
    for (let i = 0; i < budAntherCount; i++) {
      const a = i * 2.39996;
      const r = 0.065 + (i / budAntherCount) * 0.085;
      budAntherPos[i * 3] = Math.cos(a) * r;
      budAntherPos[i * 3 + 1] = 1.56 + 0.08 * Math.sin(i * 1.7);
      budAntherPos[i * 3 + 2] = Math.sin(a) * r;
    }
    const budAntherGeo = new THREE.BufferGeometry();
    budAntherGeo.setAttribute('position', new THREE.BufferAttribute(budAntherPos, 3));
    budAntherMat = new THREE.ShaderMaterial({
      uniforms: { uOpacity: { value: 0 }, uTime: { value: 0 }, uPixelRatio: { value: Math.min(DPR, 1.75) } },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: `
        uniform float uTime; uniform float uPixelRatio; varying float vTw;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          vTw = 0.72 + 0.28 * sin(uTime * 2.1 + position.x * 18.0);
          gl_PointSize = clamp(28.0 * uPixelRatio / max(1.0, -mv.z), 3.6, 13.0);
        }
      `,
      fragmentShader: `
        uniform float uOpacity; varying float vTw;
        void main() {
          vec2 q = gl_PointCoord - 0.5; float d = length(q);
          if (d > 0.5) discard;
          float g = exp(-d * d * 18.0);
          gl_FragColor = vec4(1.0, 0.84, 0.52, g * vTw * uOpacity);
        }
      `
    });
    const budAnthers = new THREE.Points(budAntherGeo, budAntherMat);
    head.g.add(budAnthers);

    const heartAura = new THREE.Sprite(new THREE.SpriteMaterial({
      map: auraTex,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false,
      opacity: 0
    }));
    heartAura.position.set(0, 1.35, 0);
    heartAura.scale.setScalar(1.95);
    head.g.add(heartAura);
    head.g.rotation.set(0.12, 0, 0.1);

    const calyxSepals = [];
    for (let i = 0; i < 5; i++) {
      const sg = new THREE.Group();
      const sc = new THREE.Mesh(leafGeo(0.72, 0.095, 0.24, 0.45), calyxMat);
      sc.position.set(0.08, 0.08, 0);
      sc.rotation.z = -0.25;
      sg.rotation.y = i * 1.2566 + 0.3;
      sg.add(sc);
      head.g.add(sg);
      calyxSepals.push(sc);
    }

    // Microscopic Crystal Dewdrops resting on petals & leaves (Fresnel + softbox specular shader)
    const dewUniforms = { uOpacity: { value: 0 }, uTime: { value: 0 } };
    const dewMat = new THREE.ShaderMaterial({
      uniforms: dewUniforms,
      transparent: true,
      depthWrite: false,
      vertexShader: `
        varying vec3 vN; varying vec3 vV;
        void main() {
          vN = normalize(normalMatrix * normal);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vV = -mv.xyz;
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform float uOpacity; uniform float uTime; varying vec3 vN; varying vec3 vV;
        void main() {
          if (uOpacity <= 0.01) discard;
          vec3 n = normalize(vN), v = normalize(vV);
          float ndv = clamp(dot(n, v), 0.0, 1.0);
          float fres = pow(1.0 - ndv, 2.2);
          vec3 lDir = normalize(vec3(-0.45, 0.62, 0.70));
          vec3 hDir = normalize(lDir + v);
          float spec1 = pow(max(0.0, dot(n, hDir)), 44.0);
          float specPin = pow(max(0.0, dot(n, hDir)), 140.0);
          float spec2 = pow(max(0.0, dot(n, normalize(vec3(0.55, -0.45, 0.62)))), 12.0) * 0.62;
          vec3 baseCol = mix(vec3(0.84, 0.96, 1.0), vec3(1.0, 0.86, 0.96), 0.5 + 0.5 * n.y);
          vec3 col = baseCol * fres * 1.05 + vec3(1.0, 0.99, 1.0) * (spec1 * 1.65 + specPin * 1.4) + vec3(0.98, 0.84, 0.96) * spec2;
          float a = clamp((0.18 + fres * 0.78 + spec1 + spec2 * 0.65) * uOpacity, 0.0, 0.98);
          gl_FragColor = vec4(col, a);
        }
      `
    });
    const dewGeo = new THREE.SphereGeometry(1, 14, 12);
    const dewDrops = [
      { kind: 'petal', pi: 4, q: 11, j: 21, scale: 0.032 },
      { kind: 'petal', pi: 7, q: 21, j: 19, scale: 0.027 },
      { kind: 'petal', pi: 10, q: 16, j: 23, scale: 0.030 },
      { kind: 'petal', pi: 14, q: 9, j: 18, scale: 0.024 },
      { kind: 'petal', pi: 18, q: 22, j: 22, scale: 0.028 },
      { kind: 'petal', pi: 23, q: 15, j: 20, scale: 0.023 },
      { kind: 'leaf', li: 0, pos: new THREE.Vector3(0.42, 0.045, 0.02), scale: 0.033 },
      { kind: 'leaf', li: 1, pos: new THREE.Vector3(0.54, -0.02, -0.03), scale: 0.030 }
    ].map(d => {
      const m = new THREE.Mesh(dewGeo, dewMat);
      m.scale.set(d.scale, d.scale * 0.82, d.scale);
      m.renderOrder = 60;
      if (d.kind === 'leaf') {
        m.position.copy(d.pos);
        leaves[d.li].m.add(m);
      } else {
        const p = head.petals[Math.min(d.pi, head.petals.length - 1)];
        d.vIdx = (Math.min(d.j, p.nv) * (p.nu + 1) + Math.min(d.q, p.nu)) * 3;
        head.g.add(m);
      }
      return { ...d, m };
    });

    const flies = [
      { ...createButterfly(0xdec4ff), phaseOffset: 0, orbitR: 2.05, orbitY: 1.5, speed: 0.27 },
      { ...createButterfly(0xffc6e4), phaseOffset: 3.1, orbitR: 2.35, orbitY: 2.15, speed: 0.22 }
    ];

    // ============================================================================
    // RISING LUMINOUS HEART POLLEN / EMBERS

        uniform vec2 uPan;
        uniform float uReveal;
        uniform float uInfTravel;
        uniform float uAspect;
        uniform float uPixelRatio;
        uniform float uScreenScale;
        varying float vAlpha;
        varying float vKind;
        varying vec3 vColor;
        void main() {
          float depth = aAttr.x;
          float phase = aAttr.y;
          float sizePx = aAttr.z;
          float isBokeh = aAttr.w;

          vec2 uv = position.xy;
          if (isBokeh > 0.5) {
            uv.y = fract(uv.y + uTime * position.z);
            uv.x += sin(uTime * 0.24 + phase) * 0.012;
          }
          uv = fract(uv + uPan * depth * vec2(0.065, 0.045));
          vec2 ndc = uv * 2.2 - 1.1; // Slight overscan outside screen prevents harsh wrap pop
          gl_Position = vec4(ndc, 0.999, 1.0);
          float scaleGain = isBokeh > 0.5 ? mix(0.68, 1.0, uScreenScale) : uScreenScale;
          gl_PointSize = sizePx * uPixelRatio * scaleGain;

          float pulse = isBokeh > 0.5
            ? (0.65 + 0.35 * sin(uTime * 0.72 + phase))
            : (0.28 + 0.72 * (0.5 + 0.5 * sin(uTime * 1.15 + phase)));
          float vis = isBokeh > 0.5
            ? (0.045 + 0.105 * uReveal) * mix(1.0, 0.42, uInfTravel) * (1.15 - depth * 0.45)
            : (0.14 + 0.42 * uReveal) * mix(1.0, 0.78, uInfTravel);
          vAlpha = pulse * vis;
          vKind = isBokeh;
          vColor = aColor;
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        varying float vKind;
        varying vec3 vColor;
        void main() {
          if (vAlpha <= 0.004) discard;
          vec2 q = gl_PointCoord - 0.5;
          float d = length(q);
          if (d > 0.5) discard;
          float mask = 0.0;
          if (vKind > 0.5) {

            mask = core + flare;
          }
          gl_FragColor = vec4(vColor, clamp(mask, 0.0, 1.0) * vAlpha);
        }
      `

    function createCathedralReverbBuffer(ctx) {
      const rate = ctx.sampleRate;
      const len = Math.floor(rate * 2.6);
      const buf = ctx.createBuffer(2, len, rate);
      for (let ch = 0; ch < 2; ch++) {
        const data = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          const env = Math.pow(1 - i / len, 2.8);
          data[i] = (Math.random() * 2 - 1) * env * 0.45;
        }
      }
      return buf;

    function playTouchNote(kind = 'tap', normX = 0) {
      if (!state.soundOn || !audioContext || !chimeGain) return;
      const notes = [440.0, 493.88, 554.37, 659.25, 739.99, 880.0, 987.77, 1108.73];
      const now = audioContext.currentTime;
      const baseIdx = Math.min(notes.length - 1, Math.max(0, Math.round((clamp(normX * 0.5 + 0.5)) * (notes.length - 1))));
      const pair = kind === 'macro' ? [notes[baseIdx], notes[Math.min(notes.length - 1, baseIdx + 2)]] : [notes[baseIdx]];
      pair.forEach((freq, idx) => {
        const t0 = now + idx * 0.065;
        const osc = audioContext.createOscillator();
        const g = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t0);

          p.connect(chimeGain);

        osc.start(t0);
        osc.stop(t0 + 1.4);

    function updateAudioDynamics() {
      if (!state.soundOn || !audioContext || !audioFilter || audioContext.state !== 'running') return;
      const angVel = Math.min(1, (Math.abs(state.velYaw) + Math.abs(state.velPitch)) * 0.42);
      const zoomLift = clamp((1 - state.zoom) * 1.4, 0, 0.55);
      const baseFreq = lerp(240, 580, state.infiniteTravel);
      const targetFreq = baseFreq + angVel * 320 + zoomLift * 140;
      audioFilter.frequency.setTargetAtTime(targetFreq, audioContext.currentTime, 0.16);
    }

    decayButton.addEventListener('click', startDecay);

    // ============================================================================
    // POINTER, TOUCH (ORBIT + PINCH ZOOM + MACRO DOUBLE-TAP) & WHEEL INPUT
    // ============================================================================
    function getPinchDistance() {
      const pts = Array.from(activePointers.values());
      if (pts.length < 2) return 0;
      return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }

    function toggleMacroFocus() {
      state.macroZoom = !state.macroZoom;
      state.targetZoom = state.macroZoom ? 0.62 : 1.0;
      state.pulseTarget = 0.75;

      triggerHaptic(7);

    function isButtonTarget(target) {
      return target instanceof Element && !!target.closest('button');
