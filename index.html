    addEventListener('pointerdown', e => {
      if (isButtonTarget(e.target)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 1) {
        primaryPointerId = e.pointerId;
        dragging = true;
        lx = e.clientX;
        ly = e.clientY;
        moved = 0;
        lastMoveTime = performance.now();
        state.velYaw = 0;
        state.velPitch = 0;
      } else if (activePointers.size === 2) {
        dragging = false;
        lastPinchDist = getPinchDistance();
      }
      pointerNdc.set((e.clientX / W) * 2 - 1, -(e.clientY / H) * 2 + 1);
      state.pointerInside = true;
      try { e.target.setPointerCapture(e.pointerId); } catch (_) { }
    });

    addEventListener('pointermove', e => {
      if (activePointers.has(e.pointerId)) {
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      }
      if (activePointers.size >= 2) {
        const dist = getPinchDistance();
        if (lastPinchDist > 0 && dist > 0) {
          const ratio = clamp(lastPinchDist / dist, 0.85, 1.18);
          state.targetZoom = clamp(state.targetZoom * ratio, 0.50, 1.65);
          state.macroZoom = state.targetZoom < 0.76;
        }
        lastPinchDist = dist;
        return;
      }
      if (primaryPointerId !== null && e.pointerId !== primaryPointerId) return;
      pointerNdc.set((e.clientX / W) * 2 - 1, -(e.clientY / H) * 2 + 1);
      state.pointerInside = true;
      if (!dragging) return;
      const nowMove = performance.now();
      const moveDt = clamp((nowMove - lastMoveTime) / 1000, 0.004, 0.08);
      lastMoveTime = nowMove;

      const dx = e.clientX - lx, dy = e.clientY - ly;
      lx = e.clientX;
      ly = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      if (moved > 4) state.userHasOrbited = true;

      const sens = isTouchDevice ? 0.0068 : 0.0052;
      const dYaw = -dx * sens;
      const dPitch = dy * sens;
      state.targetYaw += dYaw;
      state.targetPitch = clamp(state.targetPitch + dPitch, -0.92, 0.92);

      const instVelYaw = clamp((dYaw / moveDt) * 0.52, -2.6, 2.6);
      const instVelPitch = clamp((dPitch / moveDt) * 0.45, -1.6, 1.6);
      state.velYaw = lerp(state.velYaw, instVelYaw, 0.45);
      state.velPitch = lerp(state.velPitch, instVelPitch, 0.45);
      state.swayVelX = clamp(state.swayVelX + dx * 0.00075, -0.14, 0.14);
    });

    function releasePointer(e) {
      activePointers.delete(e.pointerId);
      if (activePointers.size < 2) lastPinchDist = 0;
      if (primaryPointerId !== null && e.pointerId !== primaryPointerId) return;

      if (performance.now() - lastMoveTime > 90) {
        state.velYaw = 0;
        state.velPitch = 0;
      }
      if (dragging && moved < 8 && state.mode !== 'void' && !isButtonTarget(e.target)) {
        const nowTap = performance.now();
        if (e.pointerType !== 'mouse' && nowTap - lastTapTime < 310) {
          lastTapTime = 0;
          lastDoubleTapAt = nowTap;
          toggleMacroFocus();
        } else {
          lastTapTime = nowTap;
          if (state.mode === 'decay') state.decayRateBoost = Math.min(state.decayRateBoost + 0.45, 0.9);
          state.pulseTarget = 1.0;
          state.infShock = Math.max(state.infShock, 0.65);
          bgUniforms.uShockOrigin.value.set(e.clientX / W, 1.0 - e.clientY / H);
          const tapXDir = clamp((e.clientX / W - 0.5) * 2.0, -1, 1);
          state.swayVelX = clamp(state.swayVelX + tapXDir * 0.025, -0.14, 0.14);
          state.swayVelZ += 0.032;
          playTouchNote('tap', tapXDir);
          triggerHaptic(5);
        }
      }
      dragging = false;
      primaryPointerId = null;
      if (e.pointerType !== 'mouse') state.pointerInside = false;
      try { e.target.releasePointerCapture(e.pointerId); } catch (_) { }
    }

    addEventListener('pointerup', releasePointer);
    addEventListener('pointercancel', e => {
      activePointers.delete(e.pointerId);
      lastPinchDist = 0;
      if (primaryPointerId !== null && e.pointerId !== primaryPointerId) return;
      dragging = false;
      primaryPointerId = null;
      state.pointerInside = false;
    });
    addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') state.pointerInside = false; });
    addEventListener('wheel', e => {
      if (state.mode === 'void') return;
      e.preventDefault();
      const unitScale = e.deltaMode === 1 ? 26 : e.deltaMode === 2 ? 420 : 1;
      const d = clamp(e.deltaY * unitScale, -160, 160);
      state.velZoom = clamp(state.velZoom + d * 0.0042, -1.6, 1.6);
      state.targetZoom = clamp(state.targetZoom * (1 + d * 0.00072), 0.50, 1.65);
      state.macroZoom = state.targetZoom < 0.76;
    }, { passive: false });
    addEventListener('dblclick', e => {
      if (performance.now() - lastDoubleTapAt < 500) return;
      if (state.mode !== 'void' && !isButtonTarget(e.target)) toggleMacroFocus();
    });
    document.addEventListener('visibilitychange', () => {
      lastNow = performance.now();
      if (audioContext && state.soundOn) {
        if (document.hidden) audioContext.suspend();
        else audioContext.resume();
      }
    });

    addEventListener('keydown', e => {
      if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement || e.target.isContentEditable) return;
      const k = e.key.toLowerCase();
      if (e.code === 'Space') { e.preventDefault(); startRebirth(); }
      else if (k === 'd') startDecay();
      else if (e.key === 'Escape') {
        if (state.infiniteActive) toggleInfinite();
        else { resetExperience(); enterVoid(); }
      } else if (k === 'r') { resetExperience(); enterVoid(); }
      else if (k === 'v') toggleParticles();
      else if (k === 'h') toggleInterface();
      else if (k === 'i') toggleInfinite();
      else if (k === 's') toggleSound();
    });

    // ============================================================================
    // UNIFIED ANIMATION UPDATE (DELTA-TIME CORRECT, CONTINUOUS TRANSITIONS)
    // ============================================================================
    function updateTimeline(dt) {
      const isVoid = state.mode === 'void';
      if (!isVoid) state.activeTime += dt;

      const revealT = isVoid ? 0 : smootherstep(0, 4.2 * motionScale, state.activeTime);
      state.reveal = damp(state.reveal, isVoid ? 0 : revealT, 5.0, dt);

      if (state.mode === 'awakening') {
        const st = clamp(state.activeTime / (3.3 * motionScale));
        state.stemGrowth = 0.55 * smootherstep(0, 1, st) + 0.45 * (1 - Math.pow(1 - st, 2.3));
        state.bloom = smootherstep(1.5 * motionScale, 6.8 * motionScale, state.activeTime);
        if (state.activeTime >= 7.0 * motionScale) {
          state.mode = 'living';
          updatePhase();
        }
      } else if (state.mode === 'living') {
        state.stemGrowth = damp(state.stemGrowth, 1, 4.0, dt);
        state.bloom = damp(state.bloom, 1, 4.0, dt);
        state.decayProgress = damp(state.decayProgress, 0, 4.0, dt);
      } else if (state.mode === 'decay') {
        state.stemGrowth = damp(state.stemGrowth, 1, 3.0, dt);
        state.decayRateBoost = damp(state.decayRateBoost, 0, 1.4, dt);
        const decaySpeed = (1 / (9.6 * motionScale)) * (1 + state.decayRateBoost);
        state.decayProgress = clamp(state.decayProgress + decaySpeed * dt, 0, 1);
        state.bloom = damp(state.bloom, Math.max(0.32, 1 - state.decayProgress * 0.56), 3.0, dt);
        if (state.decayProgress >= 1) {
          state.mode = 'decayed';
          updatePhase();
        }
      } else if (state.mode === 'decayed') {
        state.decayProgress = 1;
      } else if (state.mode === 'rebirth') {
        const rebirthSpeed = (state.infiniteActive ? 2.2 : 1) / (8.2 * motionScale);
        state.decayProgress = clamp(state.decayProgress - rebirthSpeed * dt, 0, 1);
        const reconstruct = 1 - state.decayProgress;
        const targetBloom = lerp(0.32, 1, smootherstep(0.16, 0.96, reconstruct));
        state.bloom = damp(state.bloom, targetBloom, 4.2, dt);
        if (state.decayProgress <= 0) {
          state.decayProgress = 0;
          state.bloom = 1;
          state.mode = 'living';
          updatePhase();
        }
      }
    }

    function updateFlowerAndDissolution(dt) {
      const t = state.simTime;
      const active = state.mode !== 'void';
      plant.visible = active;

      const springK = 1.85, springDamp = 2.65;
      state.swayVelX += (-springK * state.swayX - springDamp * state.swayVelX) * dt;
      state.swayX += state.swayVelX * dt;
      state.swayVelZ += (-springK * state.swayZ - springDamp * state.swayVelZ) * dt;
      state.swayZ += state.swayVelZ * dt;

      const breezeX = Math.sin(t * 0.27) * 0.032 * motionScale + state.swayX;
      const breezeZ = Math.cos(t * 0.21) * 0.022 * motionScale + state.swayZ;
      U.breezeX.value = breezeX;
      U.breezeZ.value = breezeZ;
      U.swayAmp.value = active ? 1 : 0;

      const decayBow = smootherstep(0.10, 0.90, state.decayProgress) * 0.22;
      plant.rotation.set(
        Math.sin(t * 0.19) * 0.014 * motionScale + breezeZ * 0.16 + decayBow,
        Math.sin(t * 0.2) * 0.045 * motionScale,
        -breezeX * 0.13 + decayBow * 0.18
      );
      plant.position.y = active ? Math.sin(t * 0.35) * 0.024 * motionScale : 0;

      updateStemGrowth(stem, state.stemGrowth);

      // Genesis light sprout & floor pool softly grounding stem base
      const genesisBurst = active ? smootherstep(0, 0.45, state.activeTime) * (1 - smootherstep(1.8, 4.4, state.activeTime)) : 0;
      const stemAlive = 1 - smootherstep(0.45, 0.98, state.decayProgress);
      seedAura.material.opacity = active ? clamp(genesisBurst * 0.52 + stemAlive * 0.045 * (1 - state.infiniteBloom)) : 0;
      seedAura.scale.setScalar(lerp(0.68, 1.35, genesisBurst) * (0.94 + 0.06 * Math.sin(t * 1.8)));

      // In Infinite Flower mode, fade physical stem & leaves cleanly into background memory so sanctuary glows pure
      const crystalPhase = smoothstep(0.04, 0.65, state.infiniteBloom);
      const stemCrystal = lerp(1.0, 0.015, crystalPhase);

      stemPlinthUniforms.uTime.value = t;
      stemPlinthUniforms.uOpacity.value = active ? clamp((0.28 + 0.55 * state.reveal) * (0.42 + 0.58 * stemAlive) * (1 - crystalPhase * 0.96)) : 0;
      stemPlinth.visible = stemPlinthUniforms.uOpacity.value > 0.005;

      const decayFade = 1 - smootherstep(0.32, 0.98, state.decayProgress);
      woodMat.opacity = active ? lerp(0.36, 1, decayFade) * stemCrystal : 0;
      woodMat.transparent = true;
      woodMat.depthWrite = woodMat.opacity >= 0.995;
      calyxMat.opacity = active ? decayFade * stemCrystal : 0;
      calyxMat.transparent = calyxMat.opacity < 0.995;
      calyxMat.depthWrite = calyxMat.opacity >= 0.995;
      coreMat.opacity = active ? decayFade * lerp(1.0, 0.0, crystalPhase) : 0;
      coreMat.transparent = coreMat.opacity < 0.995;
      coreMat.depthWrite = coreMat.opacity >= 0.995;
      core.visible = active && coreMat.opacity > 0.004;

      for (let i = 0; i < leaves.length; i++) {
        const l = leaves[i];
        const growth = active ? smootherstep(l.uLeaf + 0.015, Math.min(l.uLeaf + 0.26, 1.03), state.stemGrowth * 1.06) : 0;
        const preDroop = smootherstep(Math.max(0, l.fallDelay - 0.14), l.fallDelay, state.decayProgress);
        const fallT = smootherstep(l.fallDelay, Math.min(l.fallDelay + 0.56, 0.96), state.decayProgress);
        const dropEase = Math.pow(fallT, 1.28);
        const flutterEnv = smoothstep(0.0, 0.22, fallT) * (1.0 - 0.25 * smoothstep(0.75, 1.0, fallT));
        const flutterPhase = fallT * l.flutterFreq * Math.PI + l.phase;

        const swingX = Math.sin(flutterPhase) * l.flutterAmp * flutterEnv;
        const swingZ = Math.cos(flutterPhase * 0.72 + l.phase) * l.flutterAmp * 0.65 * flutterEnv;
        l.m.position.set(
          l.x0 + l.driftX * fallT + swingX,
          l.y0 - l.fallDrop * dropEase,
          l.z0 + l.driftZ * fallT + swingZ
        );

        const gScale = Math.max(growth * lerp(1.0, 0.88, smootherstep(0.55, 1.0, fallT)), 0.001);
        l.m.scale.set(gScale, Math.max(lerp(0.35, 1, growth) * gScale, 0.001), gScale);

        const unfoldAngle = (1 - growth) * 0.52 * (l.z > 1.5 ? -1 : 1);
        const lagBreeze = Math.sin(t * 0.42 - l.phase) * 0.024 * motionScale + breezeX * 0.12;
        const droopAngle = preDroop * 0.30 * l.droopDir;
        const bankZ = Math.cos(flutterPhase) * 0.45 * flutterEnv;
        const pitchX = Math.sin(flutterPhase * 0.7 + l.phase) * 0.36 * flutterEnv + l.tiltEndX * fallT;
        const yawY = l.y + Math.cos(t * 0.31 - l.phase) * 0.018 * motionScale * (1 - fallT) + l.spinY * fallT;
        l.m.rotation.set(pitchX, yawY, l.z + unfoldAngle + lagBreeze * (1 - fallT * 0.6) + droopAngle + bankZ);

        const leafAlpha = (1 - smootherstep(0.62, 0.98, fallT)) * stemCrystal;
        l.lm.opacity = active ? leafAlpha : 0;
        l.lm.transparent = l.lm.opacity < 0.995;
        l.lm.depthWrite = l.lm.opacity >= 0.995;
        l.m.visible = active && l.lm.opacity > 0.004 && growth > 0.004;
      }

      stem.curve.getPointAt(clamp(state.stemGrowth), _stemTip);
      head.g.position.copy(_stemTip);

      const headGrow = active ? smootherstep(0.32, 0.90, state.stemGrowth) : 0;
      const headSizeFactor = 0.9 * headGrow * (0.58 + 0.42 * smootherstep(0, 1, state.bloom));
      const headWilt = smootherstep(0.06, 0.78, state.decayProgress) * 0.24;
      head.g.scale.setScalar(Math.max(headSizeFactor, 0.001));
      head.g.rotation.set(
        0.12 + Math.sin(t * 0.25 - 0.35) * 0.015 * motionScale + breezeZ * 0.14 + headWilt,
        0,
        0.1 + Math.sin(t * 0.21 - 0.45) * 0.02 * motionScale - breezeX * 0.16 + headWilt * 0.32
      );
      receptacle.visible = active && calyxMat.opacity > 0.004 && headGrow > 0.02;
      core.scale.set(1, 1.38, 1);

      const sepalOpen = smootherstep(0.0, 0.58, state.bloom);
      const sepalWilted = smootherstep(0.12, 0.88, state.decayProgress);
      for (let i = 0; i < calyxSepals.length; i++) {
        calyxSepals[i].rotation.z = -0.25 - 0.52 * sepalOpen - 0.34 * sepalWilted;
      }

      const heartPulse = 0.85 + 0.15 * Math.sin(t * 0.72);
      const heartEnergy = active ? smootherstep(0.15, 0.9, state.bloom) * (1 - smootherstep(0.2, 0.85, state.decayProgress)) * heartPulse : 0;
      U.heartGlow.value = heartEnergy;
      heartAura.material.opacity = heartEnergy * 0.24 * lerp(1.0, 0.08, crystalPhase);
      heartAura.scale.setScalar(lerp(0.95, 1.95, smootherstep(0, 1, state.bloom)) * (0.95 + 0.05 * heartPulse));

      budAntherMat.uniforms.uTime.value = t;
      budAntherMat.uniforms.uOpacity.value = active ? smootherstep(0.38, 0.96, state.bloom) * decayFade * lerp(0.85, 0.0, crystalPhase) : 0;
      budAnthers.visible = budAntherMat.uniforms.uOpacity.value > 0.01;

      const breathAmp = smootherstep(0.55, 1.0, state.bloom) * (1 - state.decayProgress) * 0.015 * motionScale;
      const hasDust = state.decayProgress > 0.001;
      dustUniforms.uTime.value = t;
      dustPoints.visible = active && hasDust;

      plant.updateMatrixWorld(true);
      core.getWorldPosition(_heartWorldPos);
      U.heartWorld.value.copy(_heartWorldPos);
      pollenUniforms.uOrigin.value.copy(_heartWorldPos);
      pollenUniforms.uTime.value = t;
      pollenUniforms.uVisibility.value = active ? smootherstep(0.35, 0.95, state.bloom) * (1 - smootherstep(0.35, 0.92, state.decayProgress)) : 0;

      const budAlpha = smootherstep(0.08, 0.48, headGrow);
      for (let i = 0; i < head.petals.length; i++) {
        const p = head.petals[i];
        const b = smootherstep(p.delay, p.delay + 0.64, state.bloom);
        const breath = 1 + Math.sin(t * 0.65 + p.ph) * breathAmp + 0.14 * crystalPhase * (0.4 + 0.6 * p.k);
        const d = smootherstep(p.decayDelay, p.decayDelay + 0.62, state.decayProgress);

        if (budAlpha > 0.002 && (d < 0.96 || hasDust)) {
          updatePetalGeometry(p, b, breath, d);
        }

        const moveEase = easeInOutCubic(d);
        const swirl = d * p.swirlSign * 1.95;
        const cosS = Math.cos(swirl), sinS = Math.sin(swirl);
        const dx = p.detachDir.x * cosS - p.detachDir.z * sinS;
        const dz = p.detachDir.x * sinS + p.detachDir.z * cosS;

        const liftArc = Math.sin(Math.PI * d) * 0.22 - d * d * 0.20;
        p.mesh.position.set(
          dx * p.detachDist * moveEase,
          p.detachDir.y * p.detachDist * moveEase + liftArc,
          dz * p.detachDist * moveEase
        );
        p.mesh.rotation.set(
          p.rotTarget.x * moveEase,
          p.rotTarget.y * moveEase + swirl * 0.35,
          p.rotTarget.z * moveEase
        );
        p.mesh.scale.setScalar(lerp(1, 0.72, smootherstep(0.35, 1, d)));

        const petalCrystal = lerp(1.0, 0.015 + 0.013 * (1 - p.k), crystalPhase);
        const decayAlpha = 1 - smootherstep(0.30, 0.94, d);
        const finalAlpha = clamp(budAlpha * decayAlpha * petalCrystal);
        const petalDecayT = smoothstep(0.05, 0.95, d);
        p.mesh.material.userData.uPetalDecay.value = petalDecayT;
        p.mesh.material.opacity = finalAlpha;
        p.mesh.material.transparent = finalAlpha < 0.995 || petalDecayT > 0.01;
        p.mesh.material.depthWrite = finalAlpha > 0.72 && petalDecayT < 0.45;
        p.mesh.visible = active && finalAlpha > 0.002;

        if (hasDust && active) {
          const posArr = p.geo.attributes.position.array;
          const dustAppear = smootherstep(0.12, 0.46, d);
          const dustSettle = lerp(0.92, 0.42, smootherstep(0.68, 1.0, d));
          const pAlpha = dustAppear * dustSettle;
          const driftProgress = smootherstep(0.16, 1.0, d);

          for (let k = 0; k < DUST_PER_PETAL; k++) {
            const di = i * DUST_PER_PETAL + k;
            const bind = dustBindings[di];
            const vi = bind.vertexIndex * 3;

            _dustLocal.set(posArr[vi], posArr[vi + 1], posArr[vi + 2]);
            _dustWorld.copy(_dustLocal).applyMatrix4(p.mesh.matrixWorld);

            const angleShift = driftProgress * bind.swirlSpeed + Math.sin(t * 0.35 + bind.phase) * 0.1 * driftProgress;
            const ca = Math.cos(angleShift), sa = Math.sin(angleShift);
            const ox = bind.offsetX * bind.driftSpeed * driftProgress;
            const oy = bind.offsetY * bind.driftSpeed * 0.72 * driftProgress + Math.sin(t * 0.48 + bind.phase) * 0.09 * driftProgress;
            const oz = bind.offsetZ * bind.driftSpeed * driftProgress;

            const rx = ox * ca - oz * sa;
            const rz = ox * sa + oz * ca;

            const outIdx = di * 3;
            dustPosArray[outIdx] = _dustWorld.x + rx;
            dustPosArray[outIdx + 1] = _dustWorld.y + oy;
            dustPosArray[outIdx + 2] = _dustWorld.z + rz;
            dustAlphaArray[di] = pAlpha * (0.65 + 0.35 * Math.sin(t * 0.8 + bind.phase));
          }
        }
      }

      // Live Dewdrop tracking on petals & upper leaves
      const dewVis = active ? smootherstep(0.45, 0.98, state.bloom) * (1 - smootherstep(0.05, 0.35, state.decayProgress)) * (1 - crystalPhase * 0.92) : 0;
      dewUniforms.uTime.value = t;
      dewUniforms.uOpacity.value = dewVis;
      for (let i = 0; i < dewDrops.length; i++) {
        const dw = dewDrops[i];
        dw.m.visible = dewVis > 0.015;
        if (dw.kind === 'petal' && dw.m.visible) {
          const p = head.petals[Math.min(dw.pi, head.petals.length - 1)];
          const arr = p.geo.attributes.position.array;
          dw.m.position.set(arr[dw.vIdx], arr[dw.vIdx + 1], arr[dw.vIdx + 2]);
        }
      }

      if (hasDust && active) {
        dustPosAttr.needsUpdate = true;
        dustAlphaAttr.needsUpdate = true;
      }
    }

    function updateButterflies(dt) {
      const t = state.simTime;
      const active = state.mode !== 'void';
      const lifeVis = 1 - smootherstep(0.4, 0.95, state.decayProgress);
      const portraitTighten = W < H ? 0.76 : 1.0;

      for (let i = 0; i < flies.length; i++) {
        const f = flies[i];
        const a = t * f.speed + f.phaseOffset;
        const r = f.orbitR * portraitTighten;

        const x = Math.cos(a) * r;
        const z = Math.sin(a * 2.0) * (r * 0.56);
        const y = f.orbitY + Math.sin(a * 1.5 + 0.6) * 0.42;

        const vx = -Math.sin(a) * f.speed * r;
        const vz = Math.cos(a * 2.0) * 2.0 * f.speed * (r * 0.56);
        const vy = Math.cos(a * 1.5 + 0.6) * 1.5 * f.speed * 0.42;

        const flapRate = (4.8 + clamp(vy * 3.5, -1.5, 2.2)) * motionScale;
        f.flapPhase += flapRate * dt;
        const glideEnvelope = 0.70 + 0.30 * Math.sin(t * 0.55 + f.phaseOffset);
        const flap = Math.sin(f.flapPhase) * 0.54 * glideEnvelope;

        f.g.position.set(x, y, z);
        f.g.rotation.set(0.24 - vy * 0.25, Math.atan2(vx, vz), -vx * 0.14);
        f.wl.rotation.y = flap;
        f.wr.rotation.y = -flap;

        const revealFly = active ? smootherstep(4.2 * motionScale, 6.8 * motionScale, state.activeTime) : 0;
        const flyScale = Math.max(revealFly * 0.54 * lerp(0.75, 1, lifeVis), 0.001);
        f.g.scale.setScalar(flyScale);
        const flyInfFade = 1 - smoothstep(0.04, 0.48, state.infiniteTravel);
        const flyAlpha = revealFly * lifeVis * flyInfFade;
        f.mats[0].opacity = flyAlpha;
        f.mats[1].opacity = flyAlpha;
        f.mats[2].opacity = flyAlpha * 0.72;
        f.g.visible = active && flyAlpha > 0.005;
      }
    }

    function updateCamera(dt) {
      const isVoid = state.mode === 'void';
      const targetAutoWeight = dragging ? 0 : 1;
      state.autoOrbitWeight = damp(state.autoOrbitWeight, targetAutoWeight, 2.2, dt);

      const targetTravel = state.infiniteActive ? 1 : 0;
      const travelSmoothTime = (state.infiniteActive ? 1.55 : 1.4) * motionScale;
      state.infiniteTravel = smoothDamp(state.infiniteTravel, targetTravel, _infTravelVel, travelSmoothTime, dt);
      if (!state.infiniteActive && state.infiniteTravel < 0.001 && Math.abs(_infTravelVel.v) < 0.001) {
        state.infiniteTravel = 0;
        _infTravelVel.v = 0;
      }

      const dive = clamp(state.infiniteTravel);
      const bloomTarget = state.infiniteActive ? 1 : smoothstep(0.04, 0.52, dive);
      state.infiniteBloom = damp(state.infiniteBloom, bloomTarget, state.infiniteActive ? 3.2 : 4.2, dt);

      if (!dragging) {
        state.targetYaw += state.velYaw * dt;
        state.targetPitch = clamp(state.targetPitch + state.velPitch * dt, -0.92, 0.92);
        const inertiaDecay = Math.exp(-3.4 * dt);
        state.velYaw *= inertiaDecay;
        state.velPitch *= inertiaDecay;
        state.targetYaw += (0.045 + 0.14 * dive) * motionScale * state.autoOrbitWeight * dt;
      }
      if (Math.abs(state.velZoom) > 0.001) {
        state.targetZoom = clamp(state.targetZoom + state.velZoom * dt * 0.35, 0.50, 1.65);
        state.velZoom *= Math.exp(-6.2 * dt);
      }

      state.yaw = damp(state.yaw, state.targetYaw, dragging ? 18.0 : 5.5, dt);
      state.pitch = damp(state.pitch, state.targetPitch, dragging ? 18.0 : 5.5, dt);
      state.zoom = damp(state.zoom, state.targetZoom, 6.5, dt);

      // Cinematic awakening crane-up & intelligent zoom-in framing onto rose blossom
      const introGlide = isVoid ? 0 : smootherstep(0, 6.8 * motionScale, state.activeTime);
      const introDistFactor = state.userHasOrbited ? 1.0 : lerp(0.80, 1.0, introGlide);
      const introPitchBias = state.userHasOrbited ? 0 : lerp(0.14, 0, introGlide);
      const zoomFocusT = smoothstep(0.94, 0.50, state.zoom);
      const baseLookY = state.userHasOrbited ? 0.48 : lerp(-0.62, 0.48, introGlide);
      const decayLift = lerp(0, 0.25, smootherstep(0.15, 0.85, state.decayProgress));
      const zoomLookY = lerp(baseLookY, 1.72, zoomFocusT) + decayLift;

      _camGoalTarget.set(0, zoomLookY, 0);
      _camCurrentTarget.x = damp(_camCurrentTarget.x, _camGoalTarget.x, 4.2, dt);
      _camCurrentTarget.y = damp(_camCurrentTarget.y, _camGoalTarget.y, 4.2, dt);
      _camCurrentTarget.z = damp(_camCurrentTarget.z, _camGoalTarget.z, 4.2, dt);

      // Anchor onto live rose chalice heart (blending safely while flower awakens)
      heartCenter.getWorldPosition(_chaliceWorldPos);
      const headGrow = isVoid ? 0 : smootherstep(0.32, 0.90, state.stemGrowth);
      _chaliceAnchor.copy(_estChalicePos).lerp(_chaliceWorldPos, headGrow);

      const portrait = H > W;
      const offsetY = baseCamPos.y - 0.45;
      const baseDist = Math.sqrt(baseCamPos.x * baseCamPos.x + offsetY * offsetY + baseCamPos.z * baseCamPos.z);
      const decayPullBack = lerp(1.0, 1.08, smootherstep(0.12, 0.85, state.decayProgress));
      const outDist = baseDist * state.zoom * introDistFactor * decayPullBack;
      const outElev = clamp(Math.asin(offsetY / baseDist) + state.pitch + introPitchBias, -0.82, 0.82);

      // Continuous zoom works seamlessly inside Infinite Flower too
      const infZoomScale = lerp(0.66, 1.40, clamp((state.zoom - 0.50) / 1.15));
      const insideDist = (portrait ? 3.85 : 2.55) * infZoomScale;
      const insideElev = clamp((portrait ? 0.36 : 0.42) + state.pitch * 0.44, 0.14, 1.08);

      // Single continuous spherical trajectory + log-distance zoom (zero snaps or teleports)
      const focusT = smoothstep(0.0, 0.82, dive);
      _camFinalLook.lerpVectors(_camCurrentTarget, _chaliceAnchor, focusT);
      if (portrait) _camFinalLook.y -= 0.22 * focusT;

      // Subtle cinema lens dolly-FOV breath deepens immersion when diving inside the flower
      const targetFov = lerp(40, 46, dive) + Math.sin(Math.PI * dive) * 2.2;
      if (Math.abs(cam.fov - targetFov) > 0.01) {
        cam.fov = targetFov;
        cam.updateProjectionMatrix();
      }

      const camDist = Math.exp(lerp(Math.log(outDist), Math.log(insideDist), dive));
      const arcElev = 0.14 * Math.sin(Math.PI * dive);
      const camElev = lerp(outElev, insideElev, dive) + arcElev;

      const parallaxScale = lerp(1.0, 0.22, dive);
      const px = state.pointerInside && !dragging ? pointerNdc.x * 0.18 * motionScale * parallaxScale : 0;
      const py = state.pointerInside && !dragging ? pointerNdc.y * 0.09 * motionScale * parallaxScale : 0;

      cam.position.set(
        _camFinalLook.x + Math.sin(state.yaw) * Math.cos(camElev) * camDist + px,
        _camFinalLook.y + Math.sin(camElev) * camDist + py,
        _camFinalLook.z + Math.cos(state.yaw) * Math.cos(camElev) * camDist
      );
      cam.lookAt(_camFinalLook);
      cam.updateMatrixWorld();

      // Project live 3D chalice heart into normalized screen coords so background corona tracks it seamlessly
      _projVec.copy(_chaliceAnchor).project(cam);
      _heartScreenPos.x = clamp(_projVec.x * 0.5 + 0.5, 0.05, 0.95);
      _heartScreenPos.y = clamp(-_projVec.y * 0.5 + 0.5, 0.05, 0.95);

      // === Inner Universe Update — Recursive Infinite Sanctuary ===
      const bloomWave = state.infiniteBloom;
      const showUniverse = bloomWave > 0.004 || dive > 0.004;
      innerUniverse.visible = !isVoid && showUniverse;
      if (!innerUniverse.visible) return;

      innerUniverse.position.copy(_chaliceAnchor);
      innerUniverse.rotation.y += dt * (0.08 + 0.22 * dive);
      innerUniverse.rotation.x = head.g.rotation.x * 0.5 + Math.sin(state.simTime * 0.16) * 0.09 * dive;
      innerUniverse.rotation.z = head.g.rotation.z * 0.5;

      const universeScale = lerp(0.36, 1.06, smootherstep(0.0, 1.0, bloomWave * 0.55 + dive * 0.45));
      innerUniverse.scale.setScalar(universeScale);

      const masterVis = smootherstep(0.0, 0.35, bloomWave);

      // Volumetric Cosmic Nebula Veils inside the sanctuary
      infNebulaMat.uniforms.uTime.value = state.simTime;
      infNebulaMat.uniforms.uOpacity.value = masterVis * lerp(0.18, 0.36, dive);
      infNebulaPlanes[0].rotation.z += dt * 0.05;
      infNebulaPlanes[1].rotation.z -= dt * 0.04;
      infNebulaPlanes[2].rotation.y += dt * 0.06;

      // Holographic Aperture Shockwave Ring
      const shockT = clamp(state.infShock || 0);
      shockRingMat.uniforms.uTime.value = state.simTime;
      shockRingMat.uniforms.uOpacity.value = shockT * 0.78 * masterVis;
      shockRing.visible = shockT > 0.01;
      shockRing.scale.setScalar(lerp(1.45, 0.28, shockT));

      // Subtle responsive attenuation prevents additive overexposure on compact portrait mobile viewports
      const densityGain = clamp(W / 680, 0.56, 1.0);
      const tierDensityScale = lerp(0.76, 1.0, densityGain);
      const coreDensityScale = lerp(0.68, 1.0, densityGain);

      // Layer 1: 8 Recursive Logarithmic Crystal Whorls seamlessly telescoping outward forever
      const infTierVis = smootherstep(0.0, 0.26, bloomWave);
      for (let ti = 0; ti < infiniteTiers.length; ti++) {
        const tier = infiniteTiers[ti];
        const cyc = (state.simTime * 0.135 * motionScale + tier.offset) % 1;
        // Exponential zoom progression creates perceptually constant recursive speed filling the chalice
        const sc = 0.13 * Math.pow(11.8, cyc) * lerp(0.80, 1.12, dive);
        const env = smootherstep(0.0, 0.20, cyc) * (1.0 - smootherstep(0.66, 1.0, cyc));
        const unfurl = lerp(-0.34, 0.98, easeInOutCubic(cyc));
        tier.group.scale.setScalar(sc);
        tier.group.rotation.y = tier.dir * (cyc * 0.95 + state.simTime * 0.075 * motionScale);
        tier.group.position.y = lerp(-0.07, -0.22, cyc);
        for (let pi = 0; pi < tier.pivots.length; pi++) {
          tier.pivots[pi].rotation.x = unfurl;
        }
        tier.uniforms.uTime.value = state.simTime;
        tier.uniforms.uCycle.value = cyc;
        const tierCycleFade = lerp(0.32, 1.0, smoothstep(0.0, 0.30, cyc));
        tier.uniforms.uOpacity.value = env * infTierVis * lerp(0.30, 0.52, dive) * tierCycleFade * tierDensityScale;
        tier.uniforms.uShimmer.value = 0.85 + 0.15 * Math.sin(state.simTime * 1.8 + ti * 1.1);
      }

      // Layer 2: Astrolabe Orbital Constellations, Flowing Light Arcs & Comet-Tail Pearls
      for (let ri = 0; ri < orbitMaterials.length; ri++) {
        const ringFrac = ri / 11;
        const stagger = smootherstep(ringFrac * 0.40, ringFrac * 0.40 + 0.45, bloomWave);
        const shimmer = 0.74 + 0.26 * Math.sin(state.simTime * 1.1 + ri * 0.65);
        orbitMaterials[ri].opacity = stagger * lerp(0.42, 0.68, dive) * shimmer;
        orbitLines[ri].rotation.z += dt * orbitSpinSpeeds[ri] * (0.4 + 0.65 * dive);
      }
      for (let wi = 0; wi < orbitWaveUniforms.length; wi++) {
        orbitWaveUniforms[wi].uTime.value = state.simTime;
        orbitWaveUniforms[wi].uOpacity.value = masterVis * lerp(0.35, 0.85, dive);
      }

      beadUniforms.uTime.value = state.simTime;
      beadUniforms.uOpacity.value = masterVis * lerp(0.75, 1.0, dive) * lerp(0.84, 1.0, densityGain);

      // Layer 3: Ethereal Moonstone Rose-Pearl Heart
      const doubleBeat = Math.pow(Math.abs(Math.sin(state.simTime * 2.0)), 1.6);
      const heartbeat = 1.0 + 0.16 * doubleBeat;

      heartOrbUniforms.uTime.value = state.simTime;
      heartOrbUniforms.uOpacity.value = masterVis * lerp(0.84, 0.98, dive) * coreDensityScale;
      heartOrbUniforms.uBeat.value = doubleBeat;
      const orbScale = (1.0 + 0.12 * doubleBeat) * lerp(0.80, 1.05, dive);
      heartOrb.scale.set(orbScale, orbScale * 1.08, orbScale);
      heartOrb.rotation.y -= dt * 0.45;

      innerCoreMat.opacity = masterVis * lerp(0.10, 0.20, dive) * tierDensityScale;
      innerCore.scale.setScalar(heartbeat * lerp(0.68, 1.04, dive));
      innerCore.rotation.y += dt * 0.42;

      innerJewelMat.opacity = masterVis * lerp(0.24, 0.48, dive);
      innerJewel.scale.setScalar((1.0 + 0.10 * (1.0 - doubleBeat)) * lerp(0.72, 1.04, dive));
      innerJewel.rotation.y -= dt * 0.36;
      innerJewel.rotation.x += dt * 0.16;

      coreHaloMat.opacity = masterVis * (0.045 + 0.050 * dive + 0.025 * doubleBeat) * coreDensityScale;
      coreHalo.scale.setScalar(lerp(0.36, 0.54, dive) * (0.94 + 0.10 * doubleBeat));

      coreStarMat.opacity = masterVis * (0.065 + 0.080 * dive + 0.03 * doubleBeat) * coreDensityScale;
      coreStarFlare.scale.setScalar(lerp(0.44, 0.80, dive) * (0.88 + 0.18 * doubleBeat));
      coreStarMat.rotation += dt * 0.20 * motionScale;

      // Layer 4: Celestial Armillary Dome, Sacred Rose Mandala & Anther-Tipped Golden Stamens
      outerSphereMat.opacity = smootherstep(0.15, 0.75, bloomWave) * lerp(0.18, 0.32, dive);
      outerDome.rotation.y -= dt * 0.09;
      outerDome.rotation.z += dt * 0.05;

      const mandalaVis = smootherstep(0.10, 0.68, bloomWave);
      petalRingMat.opacity = mandalaVis * lerp(0.38, 0.74, dive);
      petalRingInnerMat.opacity = mandalaVis * lerp(0.36, 0.74, dive);
      petalRingLotusMat.opacity = mandalaVis * lerp(0.30, 0.68, dive);
      mandalaGroup.rotation.y += dt * 0.14;
      mandalaGroup.scale.setScalar(0.95 + 0.08 * Math.sin(state.simTime * 1.1));

      stamenMat.opacity = masterVis * lerp(0.45, 0.78, dive);
      stamenPearlUniforms.uTime.value = state.simTime;
      stamenPearlUniforms.uOpacity.value = masterVis * lerp(0.60, 0.96, dive) * coreDensityScale;
      stamenGroup.rotation.y -= dt * 0.12;
      stamenGroup.scale.setScalar(lerp(0.76, 1.06, dive) + 0.05 * doubleBeat);

      // Layer 5: 260 Prismatic Star-Spark Glints
      sparkUniforms.uTime.value = state.simTime;
      sparkUniforms.uOpacity.value = smootherstep(0.08, 0.60, bloomWave) * lerp(0.70, 1.0, dive);
    }

    function updateParticleField(dt) {
      const active = state.mode !== 'void';
      if (state.pointerInside) {
        raycaster.setFromCamera(pointerNdc, cam);
        if (raycaster.ray.intersectPlane(pointerPlane, pointerHit)) pointerTarget.copy(pointerHit);
      }
      particleUniforms.uPointer.value.x = damp(particleUniforms.uPointer.value.x, pointerTarget.x, 5.5, dt);
      particleUniforms.uPointer.value.y = damp(particleUniforms.uPointer.value.y, pointerTarget.y, 5.5, dt);
      particleUniforms.uPointer.value.z = damp(particleUniforms.uPointer.value.z, pointerTarget.z, 5.5, dt);

      const targetPtrStrength = state.pointerInside && active ? 1 : 0;
      state.pointerStrength = damp(state.pointerStrength, targetPtrStrength, 3.8, dt);
      particleUniforms.uPointerStrength.value = state.pointerStrength;

      state.pulse = damp(state.pulse, state.pulseTarget, 6.0, dt);
      state.pulseTarget = damp(state.pulseTarget, 0, 2.2, dt);
      particleUniforms.uPulse.value = state.pulse;

      particleUniforms.uTime.value = state.simTime;
      const infFieldDim = lerp(1.0, 0.42, state.infiniteTravel);
      const targetVis = state.showParticles && active ? (0.28 + 0.72 * state.reveal) * infFieldDim : 0;
      particleUniforms.uVisibility.value = damp(particleUniforms.uVisibility.value, targetVis, 4.0, dt);
    }

    function drawBackground(dt) {
      const t = state.simTime;
      const active = state.mode !== 'void';
      const panX = -Math.sin(state.yaw * 0.45);
      const panY = Math.sin(state.pitch);
      const doubleBeat = Math.pow(Math.abs(Math.sin(t * 2.0)), 1.6);

      state.infShock = damp(state.infShock || 0, 0, 1.85, dt);

      bgUniforms.uTime.value = t;
      bgUniforms.uPan.value.set(panX, panY);
      bgUniforms.uReveal.value = active ? state.reveal : 0;
      bgUniforms.uDecay.value = state.decayProgress;
      bgUniforms.uInfBloom.value = state.infiniteBloom;
      bgUniforms.uInfTravel.value = state.infiniteTravel;
      bgUniforms.uInfShock.value = state.infShock || 0;
      bgUniforms.uHeartUv.value.set(_heartScreenPos.x, 1.0 - _heartScreenPos.y);
      bgUniforms.uHeartBeat.value = doubleBeat;
      bgUniforms.uPointerUv.value.set(pointerNdc.x * 0.5 + 0.5, pointerNdc.y * 0.5 + 0.5);
      bgUniforms.uPointerGlow.value = state.pointerStrength * (1.0 - state.infiniteTravel * 0.6);

      ambientUniforms.uTime.value = t;
      ambientUniforms.uPan.value.set(panX, panY);
      ambientUniforms.uReveal.value = active ? state.reveal : 0;
      ambientUniforms.uInfTravel.value = state.infiniteTravel;
    }

    // ============================================================================
    // MAIN DELTA-TIME RENDER LOOP
    // ============================================================================
    lastNow = performance.now();

    function frame(now) {
      const rawDt = (now - lastNow) / 1000;
      lastNow = now;
      const dt = clamp(rawDt, 0, 0.05);
      state.simTime += dt;
      U.t.value = state.simTime;

      if (rawDt > 0 && rawDt < 0.12) {
        avgFrameDt = damp(avgFrameDt, rawDt, 1.5, rawDt);
        if (DPR > 1.05 && avgFrameDt > 0.038) {
          slowFrameStreak += rawDt;
          if (slowFrameStreak > 1.6 && dprScale > 0.72) {
            dprScale = 0.72;
            slowFrameStreak = 0;
            resize();
          }
        } else {
          slowFrameStreak = Math.max(0, slowFrameStreak - rawDt);
        }
      }

      updateTimeline(dt);
      updateFlowerAndDissolution(dt);
      updateButterflies(dt);
      updateCamera(dt);
      drawBackground(dt);
      updateParticleField(dt);
      updateAudioDynamics();

      renderer.render(scene, cam);
      requestAnimationFrame(frame);
    }

    resetExperience();
    enterVoid();
    requestAnimationFrame(frame);
  </script>
</body>
